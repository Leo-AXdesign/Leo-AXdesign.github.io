<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>디자인 허브 스튜디오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  /* 사이트·관리자와 같은 흑백 톤 */
  :root { --ink: #111; --body: #444; --muted: #6b6b6b; --line: #e5e5e5; --soft: #f5f5f5; --ok: #1a7f37; --bad: #c62828; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: var(--ink); }
  body { font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif; font-size: 15px; -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; }

  .bar { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.94); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .bar__in { max-width: 1280px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 16px; }
  .logo { font-size: 24px; font-weight: 800; letter-spacing: -.04em; }
  .logo span { color: #a3a3a3; } .logo small { font-size: 14px; font-weight: 700; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
  .chips { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: var(--soft); color: var(--muted); }
  .chip.on { background: #e9f5ec; color: var(--ok); } .chip.off { background: #fdecec; color: var(--bad); }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 28px; align-items: start; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  .col { display: flex; flex-direction: column; gap: 18px; }
  .h { font-size: 13px; font-weight: 800; color: var(--muted); letter-spacing: .02em; margin: 0 0 10px; }

  .reco { background: var(--ink); color: #fff; border-radius: 18px; padding: 20px 22px; }
  .reco__label { font-size: 13px; font-weight: 700; color: #a3a3a3; }
  .reco__title { margin-top: 8px; font-size: 21px; font-weight: 800; letter-spacing: -.02em; line-height: 1.35; }
  .reco__note { margin-top: 8px; font-size: 14px; color: #cfcfcf; line-height: 1.5; }
  .reco .btn { margin-top: 16px; background: #fff; color: var(--ink); border-color: #fff; }

  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .seg button { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 14px 8px; cursor: pointer; text-align: center; }
  .seg button b { display: block; font-size: 17px; font-weight: 800; }
  .seg button span { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .seg button.on { border-color: var(--ink); background: var(--ink); color: #fff; }
  .seg button.on span { color: #bdbdbd; }

  .subtabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .subtabs button { border: 0; background: var(--soft); padding: 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--muted); }
  .subtabs button.on { background: var(--ink); color: #fff; }
  .list { border: 1px solid var(--line); border-radius: 14px; max-height: 420px; overflow: auto; }
  .li { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: #fff; padding: 12px 14px; cursor: pointer; }
  .li:last-child { border-bottom: 0; } .li:hover { background: var(--soft); }
  .li.on { background: var(--ink); color: #fff; } .li.on .li__s { color: #bdbdbd; }
  .li__t { font-weight: 700; line-height: 1.4; display: flex; gap: 6px; align-items: baseline; }
  .li__s { margin-top: 3px; font-size: 12px; color: var(--muted); }
  .badge { flex: none; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); }
  .li.on .badge { background: #333; color: #ddd; }

  .btn { border: 1px solid var(--line); background: #fff; padding: 11px 18px; border-radius: 999px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--ink); }
  .btn--dark { background: var(--ink); border-color: var(--ink); color: #fff; } .btn--dark:hover { background: #333; }
  .btn--big { width: 100%; padding: 16px; font-size: 17px; border-radius: 14px; }
  .btn[disabled] { opacity: .4; pointer-events: none; }
  .row { display: flex; gap: 10px; align-items: center; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--body); cursor: pointer; }

  .panel { border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
  .empty { color: var(--muted); text-align: center; padding: 80px 20px; line-height: 1.7; }
  .pv-title { font-size: 22px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 4px; }
  .pv-meta { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
  .strip img { width: 240px; aspect-ratio: 4 / 5; border-radius: 10px; border: 1px solid var(--line); flex: none; scroll-snap-align: start; background: var(--soft); }
  video { width: 270px; aspect-ratio: 9 / 16; border-radius: 14px; background: #000; display: block; }
  label.f { display: block; font-size: 13px; font-weight: 800; color: var(--muted); margin: 18px 0 8px; }
  textarea, input.inp { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; line-height: 1.6; outline: none; background: #fff; }
  textarea:focus, input.inp:focus { border-color: var(--ink); }
  textarea { min-height: 200px; resize: vertical; }
  .count { text-align: right; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .count.over { color: var(--bad); font-weight: 700; }
  .warn { margin-top: 10px; font-size: 13px; color: var(--bad); }
  .also { margin-top: 18px; padding: 14px 16px; background: var(--soft); border-radius: 14px; }
  .also textarea { min-height: 120px; margin-top: 10px; }

  .steps { margin: 16px 0 0; padding: 0; list-style: none; font-size: 14px; line-height: 1.7; }
  .steps li::before { content: "· "; color: var(--muted); }
  .result { margin-top: 14px; padding: 14px 16px; border-radius: 14px; font-weight: 700; line-height: 1.6; white-space: pre-wrap; }
  .result.ok { background: #e9f5ec; color: var(--ok); } .result.bad { background: #fdecec; color: var(--bad); }
  .result a { color: inherit; }
  details.log { margin-top: 10px; font-size: 12px; color: var(--muted); }
  details.log pre { white-space: pre-wrap; max-height: 200px; overflow: auto; background: var(--soft); padding: 10px; border-radius: 10px; }

  .hist { font-size: 13px; }
  .hist div { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .hist time { color: var(--muted); flex: none; width: 110px; }
  .hist a { color: var(--ink); }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid #ccc; border-top-color: var(--ink); border-radius: 50%; animation: s .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header class="bar"><div class="bar__in">
  <div class="logo">d<span>.</span><small>스튜디오</small></div>
  <div class="chips" id="chips"></div>
</div></header>

<main class="wrap">
  <section class="col">
    <div id="reco"></div>

    <div>
      <p class="h">1. 무엇을 올릴까요</p>
      <div class="seg" id="seg">
        <button data-type="carousel"><b>캐러셀</b><span>넘겨 보는 카드</span></button>
        <button data-type="reel"><b>릴스</b><span>세로 영상</span></button>
        <button data-type="thread"><b>스레드</b><span>담담한 글</span></button>
      </div>
    </div>

    <div>
      <p class="h">2. 재료 고르기</p>
      <div class="subtabs" id="subtabs"></div>
      <div class="list" id="list"><div class="empty" style="padding:30px">위에서 종류를 먼저 골라 주세요.</div></div>
      <div class="row" style="margin-top:12px">
        <button class="btn btn--dark" id="make" disabled>만들기</button>
        <label class="check"><input type="checkbox" id="rebuild" /> 다시 만들기</label>
        <button class="btn" id="tour" hidden>투어 만들기</button>
      </div>
    </div>

    <div>
      <p class="h">최근 발행</p>
      <div class="hist" id="hist"></div>
    </div>
  </section>

  <section class="panel" id="preview"><div class="empty">왼쪽에서 고르고 <b>만들기</b>를 누르면<br />여기에 미리보기와 캡션이 나옵니다.</div></section>
</main>

<script>
const TOKEN = "__TOKEN__";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let S = null, type = null, sub = null, source = null, made = null;

async function api(name, body = {}) {
  const r = await fetch("/api/" + name, { method: "POST", headers: { "X-Studio-Token": TOKEN, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ ok: false, message: "응답을 읽지 못했습니다." }));
  if (!j.ok) throw new Error(j.message || "오류가 났습니다.");
  return j;
}

async function load() {
  S = await api("state");
  const t = S.tokens;
  $("#chips").innerHTML =
    `<span class="chip ${t.instagram ? "on" : "off"}">인스타그램 ${t.instagram ? "연결됨" : "토큰 없음"}</span>` +
    `<span class="chip ${t.threads ? "on" : "off"}">스레드 ${t.threads ? "연결됨" : "토큰 없음"}</span>` +
    `<span class="chip ${S.tools.ffmpeg ? "on" : ""}">${S.tools.ffmpeg ? "영상 도구 있음" : "영상 도구 없음 (brew install ffmpeg)"}</span>`;
  const r = S.recommend;
  $("#reco").innerHTML = `<div class="reco"><div class="reco__label">오늘의 추천 · ${esc(r.label)}</div>` +
    (r.type ? `<div class="reco__title">${esc(r.title)}</div><button class="btn" id="go">이걸로 만들기</button>`
            : `<div class="reco__note">${esc(r.note)}</div>`) + `</div>`;
  if (r.type) $("#go").onclick = () => { pick(r.type, r.source); doMake(); };
  $("#hist").innerHTML = S.history.length ? S.history.slice(0, 12).map((h) =>
    `<div><time>${esc(h.at.replace("T", " "))}</time><span>${esc({ carousel: "캐러셀", reel: "릴스", thread: "스레드" }[h.type])} · ${esc(h.title)} ` +
    Object.entries(h.links || {}).map(([k, v]) => v ? `<a href="${esc(v)}" target="_blank">${k === "instagram" ? "인스타" : "스레드"} ↗</a>` : "").join(" ") +
    `</span></div>`).join("") : `<div style="color:var(--muted)">아직 없습니다.</div>`;
  if (type) renderList();
}

const isDone = (key) => S.published.includes(key);

function options() {
  if (type === "carousel") {
    if (sub === "article") return S.articles.map((a) => ({ src: "article:" + a.slug, t: a.title, s: a.date + " · 읽을거리", done: isDone("carousel:article-" + a.slug) }));
    return S.refs.map((r) => ({ src: r.id, t: r.title, s: r.kicker, done: isDone("carousel:" + r.id) }));
  }
  if (type === "reel") return S.reels.map((r) => ({ src: r.id, t: r.title,
    s: (r.id.endsWith("-tour") ? "사이트 투어" : "카드 넘김") + (r.seconds ? ` · ${r.seconds}초` : " · 새로 만들기"), done: isDone("reel:" + r.id) }));
  if (sub === "article") return S.articles.map((a) => ({ src: "article:" + a.slug, t: a.title, s: a.date + " · 제목과 요약 + 링크", done: isDone("thread:article:" + a.slug) }));
  if (sub === "custom") return [{ src: "custom", t: "빈 글에서 시작", s: "직접 쓰기" }];
  return S.drafts.map((d) => ({ src: "draft:" + d.id, t: d.label, s: d.text.split("\n")[0].slice(0, 40) + "…", done: isDone("thread:draft:" + d.id) }));
}

function renderList() {
  document.querySelectorAll("#seg button").forEach((b) => b.classList.toggle("on", b.dataset.type === type));
  const tabs = type === "carousel" ? [["ref", "레퍼런스·용어"], ["article", "읽을거리"]]
             : type === "thread" ? [["draft", "초안"], ["article", "읽을거리 소개"], ["custom", "직접 쓰기"]] : [];
  if (tabs.length && !tabs.some(([k]) => k === sub)) sub = tabs[0][0];
  $("#subtabs").innerHTML = tabs.map(([k, l]) => `<button data-sub="${k}" class="${k === sub ? "on" : ""}">${l}</button>`).join("");
  $("#subtabs").querySelectorAll("button").forEach((b) => b.onclick = () => { sub = b.dataset.sub; source = null; renderList(); });
  const opts = options();
  $("#list").innerHTML = opts.map((o) => `<button class="li ${o.src === source ? "on" : ""}" data-src="${esc(o.src)}">` +
    `<div class="li__t">${esc(o.t)} ${o.done ? '<span class="badge">올림</span>' : ""}</div><div class="li__s">${esc(o.s)}</div></button>`).join("");
  $("#list").querySelectorAll(".li").forEach((b) => b.onclick = () => { source = b.dataset.src; renderList(); });
  $("#make").disabled = !source;
  $("#tour").hidden = !(type === "reel" && source && !source.endsWith("-tour"));
}

function pick(t, src) {
  type = t; source = src || null;
  if (src && t !== "reel") sub = src.startsWith("article:") ? "article" : src.startsWith("draft:") ? "draft" : src === "custom" ? "custom" : "ref";
  renderList();
}
document.querySelectorAll("#seg button").forEach((b) => b.onclick = () => pick(b.dataset.type));

$("#tour").onclick = async () => {
  const sid = source.replace(/-cards$/, "");
  try { alert((await api("tour", { source: sid })).message); } catch (e) { alert(e.message); }
};

async function doMake() {
  $("#preview").innerHTML = `<div class="empty"><span class="spin"></span>만드는 중… 캐러셀은 30초, 릴스는 1분쯤 걸려요.</div>`;
  try {
    made = await api("make", { type, source, rebuild: $("#rebuild").checked });
    showPreview();
  } catch (e) {
    $("#preview").innerHTML = `<div class="result bad">${esc(e.message)}</div>`;
  }
}
$("#make").onclick = doMake;

function counter(el, max, out) {
  const f = () => { out.textContent = `${el.value.length} / ${max}`; out.classList.toggle("over", el.value.length > max); };
  el.addEventListener("input", f); f();
}

function showPreview() {
  const m = made, isIG = m.type !== "thread";
  let media = "";
  if (m.type === "carousel") media = `<div class="strip">${m.images.map((u) => `<img src="${esc(u)}" alt="" />`).join("")}</div>`;
  if (m.type === "reel") media = `<video src="${esc(m.video)}" poster="${esc(m.cover)}" controls playsinline></video>`;
  const kindName = { carousel: "인스타그램 캐러셀", reel: "인스타그램 릴스", thread: "스레드" }[m.type];
  const thDefault = m.type === "thread" ? m.text : `${m.title}\n\n인스타에 카드로 정리해 뒀다.`;
  $("#preview").innerHTML =
    `<h2 class="pv-title">${esc(m.title)}</h2><div class="pv-meta">${kindName}${m.images ? ` · ${m.images.length}장` : ""}${m.seconds ? ` · ${m.seconds}초` : ""}` +
    `${m.published ? " · <b>이미 올린 적 있음</b>" : ""}</div>${media}` +
    (isIG ? `<label class="f">인스타 캡션</label><textarea id="cap">${esc(m.caption)}</textarea><div class="count" id="capc"></div>` +
            `<div class="also"><label class="check"><input type="checkbox" id="also" /> 스레드에도 함께 알리기 (링크 미리보기 포함)</label>` +
            `<textarea id="thtext" hidden>${esc(thDefault)}</textarea><div class="count" id="thc" hidden></div></div>`
          : `<label class="f">스레드 글</label><textarea id="thtext">${esc(m.text)}</textarea><div class="count" id="thc"></div>` +
            `<label class="f">함께 붙일 링크 (선택)</label><input class="inp" id="link" value="${esc(m.link || "")}" placeholder="https://designrefs.com/..." />`) +
    `<div class="warn" id="warn"></div>` +
    `<div style="margin-top:20px"><button class="btn btn--dark btn--big" id="pub">발행</button></div>` +
    `<ul class="steps" id="steps"></ul><div id="res"></div>`;
  if (isIG) {
    counter($("#cap"), 2200, $("#capc"));
    $("#also").onchange = () => { $("#thtext").hidden = $("#thc").hidden = !$("#also").checked; };
  }
  counter($("#thtext"), 500, $("#thc"));
  const warn = () => { const t = $("#thtext").value; $("#warn").textContent = /\[[^\]]*\]/.test(t) && (!isIG || $("#also").checked)
    ? "[ ] 로 비워 둔 자리가 있어요. 실제 경험으로 바꾸거나 지워야 발행할 수 있습니다." : ""; };
  $("#thtext").addEventListener("input", warn); warn();
  $("#pub").onclick = doPublish;
}

async function doPublish() {
  const m = made, isIG = m.type !== "thread";
  const what = { carousel: "인스타그램에 캐러셀을", reel: "인스타그램에 릴스를", thread: "스레드에 글을" }[m.type];
  if (!confirm(`${what} 공개로 올립니다. 올리면 되돌릴 수 없어요. 발행할까요?`)) return;
  const body = { type: m.type, id: m.id, title: m.title, link: isIG ? m.link : $("#link").value.trim(), draft: m.draft };
  if (isIG) Object.assign(body, { caption: $("#cap").value, also_thread: $("#also").checked, thread_text: $("#thtext").value });
  else body.text = $("#thtext").value;
  $("#pub").disabled = true;
  $("#steps").innerHTML = `<li><span class="spin"></span>시작합니다…</li>`;
  try {
    const { job } = await api("publish", body);
    for (;;) {
      await new Promise((r) => setTimeout(r, 2000));
      const j = await api("job", { job });
      $("#steps").innerHTML = j.steps.map((s) => `<li>${esc(s)}</li>`).join("") + (j.done ? "" : `<li><span class="spin"></span>진행 중…</li>`);
      if (j.done) {
        const links = Object.entries(j.links || {}).map(([k, v]) => v ? `<a href="${esc(v)}" target="_blank">${k === "instagram" ? "인스타그램에서 보기" : "스레드에서 보기"} ↗</a>` : "").join("\n");
        $("#res").innerHTML = `<div class="result ${j.ok ? "ok" : "bad"}">${esc(j.message)}${links ? "\n" + links : ""}</div>` +
          (j.log ? `<details class="log"><summary>기록 보기</summary><pre>${esc(j.log)}</pre></details>` : "");
        if (!j.ok) $("#pub").disabled = false;
        load();
        break;
      }
    }
  } catch (e) {
    $("#res").innerHTML = `<div class="result bad">${esc(e.message)}</div>`;
    $("#pub").disabled = false;
  }
}

load().catch((e) => { $("#preview").innerHTML = `<div class="result bad">${esc(e.message)}</div>`; });
</script>
</body>
</html>
