# Cloudflare Worker 설정.
# 처음 한 번만 아래 순서대로 하면 됩니다. (자세한 내용은 worker/README.md)
#   1) npx wrangler login
#   2) npx wrangler d1 create designrefs-talk   → 출력된 database_id 를 아래에 붙여넣기
#   3) npx wrangler d1 execute designrefs-talk --remote --file=schema.sql
#   4) npx wrangler secret put ADMIN_TOKEN      → 글을 지울 때 쓸 비밀번호를 직접 입력
#   5) npx wrangler secret put IP_SALT          → 아무 긴 문자열 (IP 해시에 섞는 값)
#   6) npx wrangler deploy
name = "designrefs-talk"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "designrefs-talk"
database_id = "d63b1917-9a67-476d-90c4-2a2c20e3ac3e"

[vars]
# 댓글을 받을 사이트 주소. 쉼표로 여러 개를 적을 수 있습니다.
ALLOW_ORIGIN = "https://designrefs.com,https://www.designrefs.com"
# "1" 로 바꾸면 글이 바로 보이지 않고, 승인한 글만 보입니다.
MODERATE = "0"
