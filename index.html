<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>디자인 허브 — 디자인 레퍼런스 주소모음</title>
  <meta name="description" content="UI/UX, 그래픽, 컬러, 폰트, 디자인 개발, 외주, 채용, AI까지 디자이너에게 필요한 사이트를 한곳에 모았습니다." />

  <!-- 공유(카카오톡·슬랙·SNS) 미리보기.
       배포 후 아래 두 줄의 주소를 실제 GitHub Pages 주소로 바꾸세요.
       예) https://<깃허브아이디>.github.io/<저장소이름>/ -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="디자인 허브 — 디자인 레퍼런스 주소모음" />
  <meta property="og:description" content="디자이너를 위한 레퍼런스 사이트 모음. 스타일 사전, 2026 트렌드, 용어 사전까지." />
  <meta property="og:url" content="https://USERNAME.github.io/design-hub/" />
  <meta property="og:image" content="https://USERNAME.github.io/design-hub/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="top">
    <div class="wrap top__inner">
      <a class="logo" href="#" id="logo">d<span>.</span></a>

      <div class="search">
        <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="search" class="search__input" type="search" placeholder="사이트 검색" autocomplete="off" />
        <kbd class="search__kbd">/</kbd>
      </div>

      <div class="top__actions">
        <button id="theme-toggle" class="top__btn" type="button" aria-label="테마 전환" title="라이트 / 다크 전환">
          <span class="dot"></span>
        </button>
      </div>
    </div>
  </header>

  <div class="wrap layout">
    <aside class="sidebar">
      <nav class="nav" id="nav" aria-label="카테고리"></nav>
    </aside>

    <main class="main" id="main">
      <section class="hero" id="hero">
        <h1 class="hero__title">Design Hub<span>.</span></h1>
        <p class="hero__sub">디자이너를 위한 레퍼런스 사이트 모음.</p>
      </section>

      <div class="meta">
        <div class="pills pills--tags" id="tag-filters" role="tablist" aria-label="태그 필터"></div>
        <p class="meta__text" id="stats"></p>
        <div class="view" role="group" aria-label="보기 방식">
          <button class="view__btn" data-view="list" type="button" aria-label="목록 보기" title="목록">
            <svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2.5" width="14" height="1.5"/><rect x="1" y="7.25" width="14" height="1.5"/><rect x="1" y="12" width="14" height="1.5"/></svg>
          </button>
          <button class="view__btn" data-view="grid" type="button" aria-label="격자 보기" title="격자">
            <svg viewBox="0 0 16 16" fill="currentColor"><rect x="1.5" y="1.5" width="5.5" height="5.5"/><rect x="9" y="1.5" width="5.5" height="5.5"/><rect x="1.5" y="9" width="5.5" height="5.5"/><rect x="9" y="9" width="5.5" height="5.5"/></svg>
          </button>
        </div>
      </div>

      <div id="content"></div>
    </main>
  </div>

  <footer class="footer">
    <div class="wrap footer__inner">
      <span>Copyright 2026. Design Hub. all rights reserved.</span>
      <a href="mailto:nisov0924@gmail.com">CONTACT : nisov0924@gmail.com</a>
      <a href="#" id="footer-top">맨 위로 ↑</a>
    </div>
  </footer>

  <!-- 호버 미리보기 -->
  <div class="preview" id="preview" aria-hidden="true">
    <div class="preview__shot">
      <img id="preview-img" alt="" />
    </div>
    <div class="preview__meta">
      <span class="preview__name" id="preview-name"></span>
      <span class="preview__domain" id="preview-domain"></span>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
