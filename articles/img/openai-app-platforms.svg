<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 609" role="img" aria-labelledby="t d">
  <title id="t">챗GPT 앱 플랫폼, 3년 동안 네 번</title>
  <desc id="d">플러그인은 2023년 3월에 시작해 2024년 4월에 닫았다. GPTs와 GPT 스토어는 2023년 11월에 시작해 2026년 12월 11일에 닫는다. Apps SDK는 2025년 10월, 플러그인 익스텐션은 2026년 9월에 나왔다.</desc>
  <rect width="1200" height="609" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="40" y="70" font-size="30" font-weight="800" fill="#111111" text-anchor="start">챗GPT 앱 플랫폼, 3년 동안 네 번</text>
    <text x="40" y="101" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="start">시작한 때부터 닫은(닫을) 때까지</text>
    <line x1="290.0" y1="157" x2="290.0" y2="457" stroke="#D9D9D9" stroke-width="1"/>
    <text x="290.0" y="147" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="middle">2023</text>
    <line x1="505.0" y1="157" x2="505.0" y2="457" stroke="#D9D9D9" stroke-width="1"/>
    <text x="505.0" y="147" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="middle">2024</text>
    <line x1="720.0" y1="157" x2="720.0" y2="457" stroke="#D9D9D9" stroke-width="1"/>
    <text x="720.0" y="147" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="middle">2025</text>
    <line x1="935.0" y1="157" x2="935.0" y2="457" stroke="#D9D9D9" stroke-width="1"/>
    <text x="935.0" y="147" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="middle">2026</text>
    <line x1="1150.0" y1="157" x2="1150.0" y2="457" stroke="#D9D9D9" stroke-width="1"/>
    <text x="1150.0" y="147" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="middle">2027</text>
    <text x="40" y="206.0" font-size="20" font-weight="700" fill="#111111" text-anchor="start">플러그인</text>
    <text x="40" y="228.0" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="start">2023. 3 → 2024. 4 종료</text>
    <rect x="325.83333333334963" y="194.0" width="232.91666666665037" height="20" rx="10.0" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="40" y="280.0" font-size="20" font-weight="700" fill="#111111" text-anchor="start">GPTs · GPT 스토어</text>
    <text x="40" y="302.0" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="start">2023. 11 → 2026. 12. 11 종료 예정</text>
    <rect x="469.16666666665037" y="268.0" width="626.5458333333379" height="20" rx="10.0" fill="#111111"/>
    <rect x="1085.7124999999883" y="268.0" width="52.64166666670121" height="20" rx="10.0" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="469.16666666665037" y="268.0" width="626.5458333333379" height="20" rx="10.0" fill="#111111"/>
    <text x="40" y="354.0" font-size="20" font-weight="700" fill="#111111" text-anchor="start">Apps SDK</text>
    <text x="40" y="376.0" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="start">2025. 10 →</text>
    <rect x="881.25" y="342.0" width="214.46249999998827" height="20" rx="10.0" fill="#111111"/>
    <text x="40" y="428.0" font-size="20" font-weight="700" fill="#111111" text-anchor="start">플러그인 익스텐션</text>
    <text x="40" y="450.0" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="start">2026. 9 새로</text>
    <rect x="1095.3541666666797" y="416.0" width="20.0" height="20" rx="10.0" fill="#111111"/>
    <line x1="1095.7124999999883" y1="157" x2="1095.7124999999883" y2="471" stroke="#111111" stroke-width="1.5" stroke-dasharray="3 4"/>
    <text x="1095.7124999999883" y="493" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">지금</text>
    <rect x="40" y="510" width="34" height="16" rx="8" fill="#111111"/>
    <text x="84" y="523" font-size="16" font-weight="400" fill="#444444" text-anchor="start">운영 중</text>
    <rect x="183.0" y="511" width="32" height="14" rx="7" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="226.0" y="523" font-size="16" font-weight="400" fill="#444444" text-anchor="start">종료</text>
    <rect x="293.0" y="511" width="32" height="14" rx="7" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="336.0" y="523" font-size="16" font-weight="400" fill="#444444" text-anchor="start">종료 예정</text>
    <line x1="40" y1="545" x2="1160" y2="545" stroke="#D9D9D9" stroke-width="1"/>
    <text x="40" y="569" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="start">출처: OpenAI 발표, antihype.com.br 정리 (2026. 9. 30 기준)</text>
  </g>
</svg>
