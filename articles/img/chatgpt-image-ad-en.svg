<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 772" role="img" aria-labelledby="t d">
  <title id="t">An ad beside your new image</title>
  <desc id="d">While ChatGPT generates an image, a labeled image ad appears in a separate spot from your image. It shows the product in use or a related experience, framed as inspiration.</desc>
  <rect width="1200" height="772" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="40" y="70" font-size="30" font-weight="800" fill="#111111" text-anchor="start">An ad beside your new image</text>
    <text x="40" y="101" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="start">Based on the announcement; not the real screen.</text>
    <rect x="40" y="133" width="1120" height="430" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <line x1="40" y1="173" x2="1160" y2="173" stroke="#D9D9D9" stroke-width="1.5"/>
    <circle cx="64" cy="153" r="5" fill="#D9D9D9"/>
    <circle cx="82" cy="153" r="5" fill="#D9D9D9"/>
    <circle cx="100" cy="153" r="5" fill="#D9D9D9"/>
    <text x="600.0" y="159" font-size="15" font-weight="700" fill="#6B6B6B" text-anchor="middle">ChatGPT</text>
    <rect x="742.24" y="193" width="397.76000000000005" height="39" rx="19.5" fill="#111111"/>
    <text x="760.24" y="215" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start">A campsite at dusk, with warm lighting</text>
    <rect x="64" y="254" width="560.0" height="279" rx="12" fill="#F2F2F2" stroke="#111111" stroke-width="1.5"/>
    <path d="M64 449.29999999999995L232.0 351.65L344.0 407.45000000000005L467.2 337.7L624.0 435.35V521Q624.0 533 612.0 533H76Q64 533 64 521Z" fill="#D9D9D9"/>
    <path d="M276.8 499.52L332.8 426.98L388.79999999999995 499.52Z" fill="#111111"/>
    <circle cx="512.0" cy="309.8" r="19.53" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <text x="80" y="283" font-size="17" font-weight="700" fill="#111111" text-anchor="start">The image I asked for</text>
    <rect x="684.0" y="254" width="452.0" height="279" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.5" stroke-dasharray="7 5"/>
    <rect x="698.0" y="268" width="45.08" height="29" rx="14.5" fill="#111111"/>
    <text x="710.0" y="287" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="start">Ad</text>
    <rect x="698.0" y="311" width="424.0" height="100.44" rx="8" fill="#F2F2F2"/>
    <rect x="892.0" y="336.11" width="36" height="55.242000000000004" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <path d="M900.0 336.11Q910.0 316.022 920.0 336.11" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="698.0" y="442.44" font-size="17" font-weight="700" fill="#111111" text-anchor="start">Brand lantern</text>
    <text x="698.0" y="467.44" font-size="15" font-weight="400" fill="#444444" text-anchor="start">The product in use,</text>
    <text x="698.0" y="492.44" font-size="15" font-weight="400" fill="#444444" text-anchor="start">shown as &#x27;inspiration&#x27;</text>
    <circle cx="1132.0" cy="258" r="15" fill="#111111"/><text x="1132.0" y="264.12" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
    <circle cx="654.0" cy="393.5" r="15" fill="#111111"/><text x="654.0" y="399.62" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
    <line x1="632.0" y1="393.5" x2="638.0" y2="393.5" stroke="#111111" stroke-width="2"/>
    <line x1="670.0" y1="393.5" x2="676.0" y2="393.5" stroke="#111111" stroke-width="2"/>
    <circle cx="55" cy="596.88" r="14" fill="#111111"/><text x="55" y="602.64" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="80" y="603" font-size="17" font-weight="400" fill="#444444" text-anchor="start">Clearly labeled as an ad</text>
    <circle cx="55" cy="631.88" r="14" fill="#111111"/><text x="55" y="637.64" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="80" y="638" font-size="17" font-weight="400" fill="#444444" text-anchor="start">Kept apart from your image</text>
    <circle cx="55" cy="666.88" r="14" fill="#111111"/><text x="55" y="672.64" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="80" y="673" font-size="17" font-weight="400" fill="#444444" text-anchor="start">Doesn&#x27;t change the answer</text>
    <line x1="40" y1="704" x2="1160" y2="704" stroke="#D9D9D9" stroke-width="1"/>
    <text x="40" y="732" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="start">Sources: OpenAI (Oct 5, 2026), TechCrunch</text>
  </g>
</svg>
