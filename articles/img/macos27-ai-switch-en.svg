<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 639" role="img" aria-labelledby="t d">
  <title id="t">The all-off switch is gone</title>
  <desc id="d">In macOS 26, one switch turned off all of Apple Intelligence and removed its models. In macOS 27 that switch is gone: features must be turned off one by one, and the model files remain.</desc>
  <rect width="1200" height="639" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="40" y="70" font-size="30" font-weight="800" fill="#111111" text-anchor="start">The all-off switch is gone</text>
    <text x="40" y="101" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="start">Turning off Apple Intelligence in macOS 26 vs 27. A sketch based on reports</text>
    <rect x="40" y="137" width="540.0" height="373" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <text x="62" y="179" font-size="22" font-weight="800" fill="#111111" text-anchor="start">macOS 26</text>
    <rect x="52" y="201" width="516.0" height="43" rx="8" fill="#F2F2F2"/>
    <text x="64" y="226" font-size="17" font-weight="800" fill="#111111" text-anchor="start">All of Apple Intelligence</text>
    <rect x="500.0" y="205" width="52.0" height="30.0" rx="15.0" fill="#D9D9D9"/>
    <circle cx="515.0" cy="220.0" r="11.0" fill="#FFFFFF"/>
    <text x="84" y="279" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="start">Writing Tools</text>
    <rect x="504.0" y="261" width="44.199999999999996" height="25.5" rx="12.75" fill="#D9D9D9"/>
    <circle cx="516.75" cy="273.75" r="8.75" fill="#FFFFFF"/>
    <line x1="60" y1="301" x2="560.0" y2="301" stroke="#D9D9D9" stroke-width="1"/>
    <text x="84" y="318" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="start">Genmoji</text>
    <rect x="504.0" y="300" width="44.199999999999996" height="25.5" rx="12.75" fill="#D9D9D9"/>
    <circle cx="516.75" cy="312.75" r="8.75" fill="#FFFFFF"/>
    <line x1="60" y1="340" x2="560.0" y2="340" stroke="#D9D9D9" stroke-width="1"/>
    <text x="84" y="357" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="start">Image Playground</text>
    <rect x="504.0" y="339" width="44.199999999999996" height="25.5" rx="12.75" fill="#D9D9D9"/>
    <circle cx="516.75" cy="351.75" r="8.75" fill="#FFFFFF"/>
    <line x1="60" y1="379" x2="560.0" y2="379" stroke="#D9D9D9" stroke-width="1"/>
    <text x="84" y="396" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="start">Siri</text>
    <rect x="504.0" y="378" width="44.199999999999996" height="25.5" rx="12.75" fill="#D9D9D9"/>
    <circle cx="516.75" cy="390.75" r="8.75" fill="#FFFFFF"/>
    <line x1="60" y1="418" x2="560.0" y2="418" stroke="#D9D9D9" stroke-width="1"/>
    <text x="84" y="435" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="start">ChatGPT extension</text>
    <rect x="504.0" y="417" width="44.199999999999996" height="25.5" rx="12.75" fill="#D9D9D9"/>
    <circle cx="516.75" cy="429.75" r="8.75" fill="#FFFFFF"/>
    <line x1="60" y1="457" x2="560.0" y2="457" stroke="#D9D9D9" stroke-width="1"/>
    <text x="84" y="474" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="start">and several more</text>
    <line x1="60" y1="496" x2="560.0" y2="496" stroke="#D9D9D9" stroke-width="1"/>
    <text x="40" y="541" font-size="16" font-weight="400" fill="#444444" text-anchor="start">One switch turned it all off and removed models</text>
    <rect x="620.0" y="137" width="540.0" height="320" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <text x="642.0" y="179" font-size="22" font-weight="800" fill="#111111" text-anchor="start">macOS 27</text>
