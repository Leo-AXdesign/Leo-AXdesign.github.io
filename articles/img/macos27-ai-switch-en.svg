    <circle cx="1096.75" cy="259.75" r="8.75" fill="#FFFFFF"/>
    <line x1="640.0" y1="287" x2="1140.0" y2="287" stroke="#D9D9D9" stroke-width="1"/>
    <text x="644.0" y="304" font-size="16" font-weight="400" fill="#444444" text-anchor="start">Image Playground</text>
    <rect x="1084.0" y="286" width="44.199999999999996" height="25.5" rx="12.75" fill="#D9D9D9"/>
    <circle cx="1096.75" cy="298.75" r="8.75" fill="#FFFFFF"/>
    <line x1="640.0" y1="326" x2="1140.0" y2="326" stroke="#D9D9D9" stroke-width="1"/>
    <text x="644.0" y="343" font-size="16" font-weight="400" fill="#444444" text-anchor="start">Siri</text>
    <rect x="1084.0" y="325" width="44.199999999999996" height="25.5" rx="12.75" fill="#D9D9D9"/>
    <circle cx="1096.75" cy="337.75" r="8.75" fill="#FFFFFF"/>
    <line x1="640.0" y1="365" x2="1140.0" y2="365" stroke="#D9D9D9" stroke-width="1"/>
    <text x="644.0" y="382" font-size="16" font-weight="400" fill="#444444" text-anchor="start">ChatGPT extension</text>
    <rect x="1084.0" y="364" width="44.199999999999996" height="25.5" rx="12.75" fill="#D9D9D9"/>
    <circle cx="1096.75" cy="376.75" r="8.75" fill="#FFFFFF"/>
    <line x1="640.0" y1="404" x2="1140.0" y2="404" stroke="#D9D9D9" stroke-width="1"/>
    <text x="644.0" y="421" font-size="16" font-weight="400" fill="#444444" text-anchor="start">and several more</text>
    <line x1="640.0" y1="443" x2="1140.0" y2="443" stroke="#D9D9D9" stroke-width="1"/>
    <text x="620.0" y="488" font-size="16" font-weight="400" fill="#444444" text-anchor="start">Turn off each feature; models (up to 14GB) stay</text>
    <line x1="40" y1="571" x2="1160" y2="571" stroke="#D9D9D9" stroke-width="1"/>
    <text x="40" y="599" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="start">Sources: MacRumors, Digital Trends, Futurism (Oct 2026)</text>
  </g>
</svg>
