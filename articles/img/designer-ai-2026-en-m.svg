<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1205" role="img" aria-labelledby="t d">
  <title id="t">Designers and AI, one year on</title>
  <desc id="d">Designers using AI weekly rose from 54% in 2025 to 91% in 2026. AI tools used regularly rose from 3 to 7 on average. Most-used models: Claude 78%, ChatGPT 65%.</desc>
  <rect width="600" height="1205" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="32" y="68" font-size="36" font-weight="800" fill="#111111" letter-spacing="-0.5">Designers and AI, one year on</text>
    <text x="32" y="102" font-size="22" fill="#6B6B6B">AI in Design Report 2026</text>
    <text x="32" y="136" font-size="22" fill="#6B6B6B">900+ designers, 60+ countries</text>
    <text x="32" y="206" font-size="30" font-weight="700" fill="#111111">Use AI weekly</text>
    <text x="32" y="238" font-size="22" fill="#6B6B6B">share of designers</text>
    <text x="32" y="291" font-size="23" fill="#444444">2025</text>
    <path d="M32 303H271.8571428571429A7 7 0 0 1 278.8571428571429 310V332A7 7 0 0 1 271.8571428571429 339H32Z" fill="#111111"/>
    <text x="292.8571428571429" y="331.08" font-size="28" font-weight="700" fill="#111111">54%</text>
    <text x="32" y="385" font-size="23" fill="#444444">2026</text>
    <path d="M32 397H441.0A7 7 0 0 1 448.0 404V426A7 7 0 0 1 441.0 433H32Z" fill="#111111"/>
    <text x="462.0" y="425.08" font-size="28" font-weight="700" fill="#111111">91%</text>
    <line x1="32" y1="268" x2="32" y2="456" stroke="#D9D9D9" stroke-width="1.8"/>
    <text x="32" y="530" font-size="30" font-weight="700" fill="#111111">AI tools in regular use</text>
    <text x="32" y="562" font-size="22" fill="#6B6B6B">average count</text>
    <text x="32" y="615" font-size="23" fill="#444444">2025</text>
    <path d="M32 627H203.28571428571428A7 7 0 0 1 210.28571428571428 634V656A7 7 0 0 1 203.28571428571428 663H32Z" fill="#111111"/>
    <text x="224.28571428571428" y="655.08" font-size="28" font-weight="700" fill="#111111">3</text>
    <text x="32" y="709" font-size="23" fill="#444444">2026</text>
    <path d="M32 721H441.0A7 7 0 0 1 448.0 728V750A7 7 0 0 1 441.0 757H32Z" fill="#111111"/>
    <text x="462.0" y="749.08" font-size="28" font-weight="700" fill="#111111">7</text>
    <line x1="32" y1="592" x2="32" y2="780" stroke="#D9D9D9" stroke-width="1.8"/>
    <text x="32" y="854" font-size="30" font-weight="700" fill="#111111">Models used (2026)</text>
    <text x="32" y="886" font-size="22" fill="#6B6B6B">share of designers</text>
    <text x="32" y="939" font-size="23" fill="#444444">Claude</text>
    <path d="M32 951H441.0A7 7 0 0 1 448.0 958V980A7 7 0 0 1 441.0 987H32Z" fill="#111111"/>
    <text x="462.0" y="979.08" font-size="28" font-weight="700" fill="#111111">78%</text>
    <text x="32" y="1033" font-size="23" fill="#444444">ChatGPT</text>
    <path d="M32 1045H371.6666666666667A7 7 0 0 1 378.6666666666667 1052V1074A7 7 0 0 1 371.6666666666667 1081H32Z" fill="#111111"/>
    <text x="392.6666666666667" y="1073.08" font-size="28" font-weight="700" fill="#111111">65%</text>
    <line x1="32" y1="916" x2="32" y2="1104" stroke="#D9D9D9" stroke-width="1.8"/>
    <line x1="32" y1="1122" x2="568" y2="1122" stroke="#D9D9D9" stroke-width="1"/>
    <text x="32" y="1148" font-size="19" fill="#6B6B6B">Source: AI in Design Report 2026 (May 20, 2026).</text>
    <text x="32" y="1177" font-size="19" fill="#6B6B6B">Usage is the share of designers who said they use each tool.</text>
  </g>
</svg>
