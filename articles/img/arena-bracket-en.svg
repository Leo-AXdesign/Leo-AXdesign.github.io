<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 587" role="img" aria-labelledby="t d">
  <title id="t">How one Design Arena vote works</title>
  <desc id="d">Design Arena sends the same prompt to four models and asks a voter to pick between two hidden designs five times. Picks 1 and 2 pair them up; pick 3 has the two winners meet to decide 1st, pick 4 has the two losers meet to decide 4th, and pick 5 settles 2nd and 3rd.</desc>
  <rect width="1200" height="587" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="40" y="70" font-size="30" font-weight="800" fill="#111111" text-anchor="start">How one Design Arena vote works</text>
    <text x="40" y="101" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="start">Four models, one prompt · five picks settle 1st to 4th</text>
    <rect x="40.0" y="141" width="250.0" height="236" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <circle cx="66.0" cy="171" r="15" fill="#111111"/><text x="66.0" y="177.12" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="90.0" y="178" font-size="21" font-weight="800" fill="#111111" text-anchor="start">Four, unnamed</text>
    <text x="62.0" y="213" font-size="16" font-weight="400" fill="#444444" text-anchor="start">Same prompt, names hidden</text>
    <rect x="62.0" y="239" width="42" height="42" rx="9" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="83.0" y="267.2" font-size="20" font-weight="800" fill="#111111" text-anchor="middle">A</text>
    <rect x="114.0" y="239" width="42" height="42" rx="9" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="135.0" y="267.2" font-size="20" font-weight="800" fill="#111111" text-anchor="middle">B</text>
    <rect x="166.0" y="239" width="42" height="42" rx="9" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="187.0" y="267.2" font-size="20" font-weight="800" fill="#111111" text-anchor="middle">C</text>
    <rect x="218.0" y="239" width="42" height="42" rx="9" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="239.0" y="267.2" font-size="20" font-weight="800" fill="#111111" text-anchor="middle">D</text>
    <path d="M296.0 259.0h26m-8 -7l8 7l-8 7" fill="none" stroke="#111111" stroke-width="2"/>
    <rect x="330.0" y="141" width="250.0" height="236" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <circle cx="356.0" cy="171" r="15" fill="#111111"/><text x="356.0" y="177.12" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="380.0" y="178" font-size="21" font-weight="800" fill="#111111" text-anchor="start">Picks 1 · 2</text>
    <text x="352.0" y="213" font-size="16" font-weight="400" fill="#444444" text-anchor="start">Choose within each pair</text>
    <rect x="352.0" y="239" width="42" height="42" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/><text x="373.0" y="267.2" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">A</text>
    <text x="409.0" y="266.0" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="middle">vs</text>
    <rect x="424.0" y="239" width="42" height="42" rx="9" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="445.0" y="267.2" font-size="20" font-weight="800" fill="#111111" text-anchor="middle">B</text>
    <rect x="352.0" y="297" width="42" height="42" rx="9" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="373.0" y="325.2" font-size="20" font-weight="800" fill="#111111" text-anchor="middle">C</text>
    <text x="409.0" y="324.0" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="middle">vs</text>
    <rect x="424.0" y="297" width="42" height="42" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/><text x="445.0" y="325.2" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">D</text>
    <path d="M586.0 259.0h26m-8 -7l8 7l-8 7" fill="none" stroke="#111111" stroke-width="2"/>
    <rect x="620.0" y="141" width="250.0" height="236" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <circle cx="646.0" cy="171" r="15" fill="#111111"/><text x="646.0" y="177.12" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="670.0" y="178" font-size="21" font-weight="800" fill="#111111" text-anchor="start">Picks 3 · 4</text>
    <text x="642.0" y="213" font-size="16" font-weight="400" fill="#444444" text-anchor="start">Winners meet, losers meet</text>
    <rect x="642.0" y="239" width="42" height="42" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/><text x="663.0" y="267.2" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">A</text>
    <text x="699.0" y="266.0" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="middle">vs</text>
    <rect x="714.0" y="239" width="42" height="42" rx="9" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="735.0" y="267.2" font-size="20" font-weight="800" fill="#111111" text-anchor="middle">D</text>
    <text x="770.0" y="265.76" font-size="16" font-weight="700" fill="#111111" text-anchor="start">→ 1st</text>
    <rect x="642.0" y="297" width="42" height="42" rx="9" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="663.0" y="325.2" font-size="20" font-weight="800" fill="#111111" text-anchor="middle">B</text>
    <text x="699.0" y="324.0" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="middle">vs</text>
    <rect x="714.0" y="297" width="42" height="42" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/><text x="735.0" y="325.2" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">C</text>
    <text x="770.0" y="323.76" font-size="16" font-weight="700" fill="#111111" text-anchor="start">→ 4th</text>
    <path d="M876.0 259.0h26m-8 -7l8 7l-8 7" fill="none" stroke="#111111" stroke-width="2"/>
    <rect x="910.0" y="141" width="250.0" height="236" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <circle cx="936.0" cy="171" r="15" fill="#111111"/><text x="936.0" y="177.12" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="960.0" y="178" font-size="21" font-weight="800" fill="#111111" text-anchor="start">Pick 5</text>
    <text x="932.0" y="213" font-size="16" font-weight="400" fill="#444444" text-anchor="start">Settle the middle two</text>
    <rect x="932.0" y="239" width="42" height="42" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/><text x="953.0" y="267.2" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">D</text>
    <text x="989.0" y="266.0" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="middle">vs</text>
    <rect x="1004.0" y="239" width="42" height="42" rx="9" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="1025.0" y="267.2" font-size="20" font-weight="800" fill="#111111" text-anchor="middle">B</text>
    <text x="1060.0" y="265.76" font-size="16" font-weight="700" fill="#111111" text-anchor="start">→ 2nd · 3rd</text>
    <text x="40" y="439.56" font-size="21" font-weight="800" fill="#111111" text-anchor="start">Result</text>
    <rect x="150" y="411" width="42" height="42" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/><text x="171.0" y="439.2" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">A</text>
    <text x="200" y="437.76" font-size="16" font-weight="700" fill="#6B6B6B" text-anchor="start">1</text>
    <rect x="262" y="411" width="42" height="42" rx="9" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="283.0" y="439.2" font-size="20" font-weight="800" fill="#111111" text-anchor="middle">D</text>
    <text x="312" y="437.76" font-size="16" font-weight="700" fill="#6B6B6B" text-anchor="start">2</text>
    <rect x="374" y="411" width="42" height="42" rx="9" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="395.0" y="439.2" font-size="20" font-weight="800" fill="#111111" text-anchor="middle">B</text>
    <text x="424" y="437.76" font-size="16" font-weight="700" fill="#6B6B6B" text-anchor="start">3</text>
    <rect x="486" y="411" width="42" height="42" rx="9" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="507.0" y="439.2" font-size="20" font-weight="800" fill="#111111" text-anchor="middle">C</text>
    <text x="536" y="437.76" font-size="16" font-weight="700" fill="#6B6B6B" text-anchor="start">4</text>
    <text x="40" y="487" font-size="16" font-weight="400" fill="#444444" text-anchor="start">Model names are revealed after voting</text>
    <line x1="40" y1="519" x2="1160" y2="519" stroke="#D9D9D9" stroke-width="1"/>
    <text x="40" y="547" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="start">Source: designarena.ai About page. Winners shown are an example.</text>
  </g>
</svg>
