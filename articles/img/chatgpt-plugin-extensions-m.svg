<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1122" role="img" aria-labelledby="t d">
  <title id="t">플러그인이 들어가는 세 자리</title>
  <desc id="d">챗GPT 화면에서 플러그인 익스텐션이 들어가는 세 자리. 대화 옆 사이드 패널(예: 캔바), 파일을 여는 파일 뷰어(예: 어도비 애크로뱃·포토샵), 입력창의 @호출(예: 피그마 파일 검색).</desc>
  <rect width="600" height="1122" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="32" y="66" font-size="34" font-weight="800" fill="#111111" text-anchor="start">플러그인이 들어가는 세 자리</text>
    <text x="32" y="99" font-size="21" font-weight="400" fill="#6B6B6B" text-anchor="start">발표 내용을 바탕으로 그린 구조도예요. 실제 화면과는 다릅니다.</text>
    <rect x="32" y="131" width="536" height="591" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <line x1="32" y1="171" x2="568" y2="171" stroke="#D9D9D9" stroke-width="1.5"/>
    <circle cx="56" cy="151" r="5" fill="#D9D9D9"/>
    <circle cx="74" cy="151" r="5" fill="#D9D9D9"/>
    <circle cx="92" cy="151" r="5" fill="#D9D9D9"/>
    <text x="300.0" y="157" font-size="17" font-weight="700" fill="#6B6B6B" text-anchor="middle">ChatGPT</text>
    <rect x="232.7" y="195" width="315.3" height="41" rx="20.5" fill="#111111"/>
    <text x="250.7" y="219" font-size="19" font-weight="400" fill="#FFFFFF" text-anchor="start">배너 시안 세 개만 뽑아 줘</text>
    <rect x="52" y="248" width="333.92" height="41" rx="20.5" fill="#F2F2F2"/>
    <text x="70" y="272" font-size="19" font-weight="400" fill="#444444" text-anchor="start">세 가지 방향으로 만들었어요.</text>
    <rect x="52" y="301" width="427.02" height="41" rx="20.5" fill="#F2F2F2"/>
    <text x="70" y="325" font-size="19" font-weight="400" fill="#444444" text-anchor="start">오른쪽 패널에서 바로 고칠 수 있어요.</text>
    <rect x="52" y="358" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <rect x="64" y="370" width="32" height="32" rx="6" fill="#F2F2F2" stroke="#D9D9D9"/>
    <text x="108" y="383" font-size="18" font-weight="700" fill="#111111" text-anchor="start">banner-a.psd</text>
    <text x="108" y="404" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="start">파일 뷰어 →</text>
    <circle cx="346" cy="360" r="15" fill="#111111"/><text x="346" y="366.12" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
    <rect x="52" y="434" width="496" height="44" rx="22" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <rect x="62" y="443" width="90.67999999999999" height="26" rx="13" fill="#111111"/>
    <text x="72" y="462" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">@Figma</text>
    <text x="164.68" y="462" font-size="17" font-weight="400" fill="#444444" text-anchor="start">지난주 랜딩 시안 찾아 줘</text>
    <circle cx="54" cy="436" r="15" fill="#111111"/><text x="54" y="442.12" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
    <rect x="52" y="502" width="496" height="200" rx="12" fill="#F2F2F2" stroke="#111111" stroke-width="1.5"/>
    <text x="72" y="536" font-size="20" font-weight="800" fill="#111111" text-anchor="start">사이드 패널</text>
    <text x="72" y="560" font-size="17" font-weight="400" fill="#6B6B6B" text-anchor="start">예: 캔바 편집 도구</text>
    <rect x="72" y="578" width="412" height="104" rx="8" fill="#FFFFFF" stroke="#D9D9D9"/>
    <rect x="88" y="594" width="226.60000000000002" height="16.64" rx="4" fill="#111111"/>
    <rect x="88" y="616.64" width="156.56" height="8" rx="4" fill="#D9D9D9"/>
    <circle cx="368.64" cy="642.48" r="20.8" fill="#D9D9D9"/>
    <rect x="496" y="578" width="28" height="28" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
    <rect x="496" y="614" width="28" height="28" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
    <rect x="496" y="650" width="28" height="28" rx="6" fill="#FFFFFF" stroke="#D9D9D9"/>
    <circle cx="544" cy="506" r="15" fill="#111111"/><text x="544" y="512.12" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
    <circle cx="47" cy="754.8" r="14" fill="#111111"/><text x="47" y="760.56" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="72" y="762" font-size="20" font-weight="700" fill="#111111" text-anchor="start">사이드 패널</text>
    <text x="72" y="792" font-size="19" font-weight="400" fill="#444444" text-anchor="start">대화 옆에 앱 화면을 띄움. 캔바가 디자인</text>
    <text x="72" y="822" font-size="19" font-weight="400" fill="#444444" text-anchor="start">도구를 여기에 넣었다.</text>
    <circle cx="47" cy="856.8" r="14" fill="#111111"/><text x="47" y="862.56" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="72" y="864" font-size="20" font-weight="700" fill="#111111" text-anchor="start">파일 뷰어</text>
    <text x="72" y="894" font-size="19" font-weight="400" fill="#444444" text-anchor="start">대화 속 파일을 앱으로 연다. 어도비는 PDF를</text>
    <text x="72" y="924" font-size="19" font-weight="400" fill="#444444" text-anchor="start">애크로뱃, 이미지를 포토샵으로.</text>
    <circle cx="47" cy="958.8" r="14" fill="#111111"/><text x="47" y="964.56" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="72" y="966" font-size="20" font-weight="700" fill="#111111" text-anchor="start">@호출</text>
    <text x="72" y="996" font-size="19" font-weight="400" fill="#444444" text-anchor="start">입력창에서 앱을 부른다. 피그마는 파일 검색을</text>
    <text x="72" y="1026" font-size="19" font-weight="400" fill="#444444" text-anchor="start">여기에 넣었다.</text>
    <line x1="32" y1="1066" x2="568" y2="1066" stroke="#D9D9D9" stroke-width="1"/>
    <text x="32" y="1090" font-size="17" font-weight="400" fill="#6B6B6B" text-anchor="start">출처: OpenAI 데브데이 발표, the-decoder, antihype.com.br</text>
  </g>
</svg>
