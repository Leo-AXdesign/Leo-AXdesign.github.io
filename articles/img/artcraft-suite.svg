<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 559" role="img" aria-labelledby="t d">
  <title id="t">AI로 다시 만든 일곱 개, 지금 어디까지 왔나</title>
  <desc id="d">ArtCraft의 일곱 개 앱. 포토샵을 대체하는 PhotoCraft와 애크로뱃을 대체하는 PrintCraft는 초기 알파, 일러스트레이터·인디자인·라이트룸·프리미어·애프터 이펙트를 대체하는 나머지 다섯 개는 개발 중이다.</desc>
  <rect width="1200" height="559" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
