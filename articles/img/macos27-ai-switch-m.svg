    <text x="32" y="99" font-size="21" font-weight="400" fill="#6B6B6B" text-anchor="start">macOS 26과 27의 &#x27;Apple Intelligence&#x27; 끄기.</text>
    <text x="32" y="130" font-size="21" font-weight="400" fill="#6B6B6B" text-anchor="start">보도를 바탕으로 그린 개념도</text>
