<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1060" role="img" aria-labelledby="t d">
  <title id="t">한 번에 끄던 스위치가 사라졌다</title>
  <desc id="d">macOS 26에서는 Apple Intelligence 전체를 스위치 하나로 끄고 모델도 지울 수 있었다. macOS 27에서는 그 스위치가 사라져 기능을 하나씩 꺼야 하고, 꺼도 모델 파일은 남는다.</desc>
  <rect width="600" height="1060" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
