<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 459" role="img" aria-labelledby="t d">
  <title id="t">같은 브랜드, 엇갈린 숫자</title>
  <desc id="d">Zappi 조사에서 환타 할로윈 제품의 차별성은 85%로 평균 71%보다, 장점 인식은 62%로 평균 47%보다 높았다. 한편 Z세대 조사에서는 74%가 AI로 만든 마케팅에 부정적으로 반응했다.</desc>
  <rect width="1200" height="459" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="40" y="70" font-size="30" font-weight="800" fill="#111111" letter-spacing="-0.5">같은 브랜드, 엇갈린 숫자</text>
    <text x="40" y="101" font-size="19" fill="#6B6B6B">제품 반응은 좋고, AI 광고에 대한 경계는 크다</text>
    <text x="40.0" y="165" font-size="24" font-weight="700" fill="#111111">제품이 남다르다</text>
    <text x="40.0" y="193" font-size="18" fill="#6B6B6B">Zappi · 환타 할로윈 제품</text>
    <text x="40.0" y="237" font-size="18" fill="#444444">환타</text>
    <path d="M40.0 247H270.3333333333333A7 7 0 0 1 277.3333333333333 254V270A7 7 0 0 1 270.3333333333333 277H40.0Z" fill="#111111"/>
    <text x="289.3333333333333" y="269.92" font-size="22" font-weight="700" fill="#111111">85%</text>
    <text x="40.0" y="315" font-size="18" fill="#444444">평균</text>
    <path d="M40.0 325H231.24313725490194A7 7 0 0 1 238.24313725490194 332V348A7 7 0 0 1 231.24313725490194 355H40.0Z" fill="#111111"/>
    <text x="250.24313725490194" y="347.92" font-size="22" font-weight="700" fill="#111111">71%</text>
    <line x1="40.0" y1="219" x2="40.0" y2="375" stroke="#D9D9D9" stroke-width="1.6"/>
    <text x="433.3333333333333" y="165" font-size="24" font-weight="700" fill="#111111">더 낫다고 느낌</text>
    <text x="433.3333333333333" y="193" font-size="18" fill="#6B6B6B">Zappi · 환타 할로윈 제품</text>
    <text x="433.3333333333333" y="237" font-size="18" fill="#444444">환타</text>
    <path d="M433.3333333333333 247H663.6666666666666A7 7 0 0 1 670.6666666666666 254V270A7 7 0 0 1 663.6666666666666 277H433.3333333333333Z" fill="#111111"/>
    <text x="682.6666666666666" y="269.92" font-size="22" font-weight="700" fill="#111111">62%</text>
    <text x="433.3333333333333" y="315" font-size="18" fill="#444444">평균</text>
    <path d="M433.3333333333333 325H606.247311827957A7 7 0 0 1 613.247311827957 332V348A7 7 0 0 1 606.247311827957 355H433.3333333333333Z" fill="#111111"/>
    <text x="625.247311827957" y="347.92" font-size="22" font-weight="700" fill="#111111">47%</text>
    <line x1="433.3333333333333" y1="219" x2="433.3333333333333" y2="375" stroke="#D9D9D9" stroke-width="1.6"/>
    <text x="826.6666666666666" y="165" font-size="24" font-weight="700" fill="#111111">AI 마케팅에 부정적</text>
    <text x="826.6666666666666" y="193" font-size="18" fill="#6B6B6B">Z세대 · Rival Technologies</text>
    <text x="826.6666666666666" y="237" font-size="18" fill="#444444">부정적 반응</text>
    <path d="M826.6666666666666 247H1057.0A7 7 0 0 1 1064.0 254V270A7 7 0 0 1 1057.0 277H826.6666666666666Z" fill="#111111"/>
    <text x="1076.0" y="269.92" font-size="22" font-weight="700" fill="#111111">74%</text>
    <text x="826.6666666666666" y="315" font-size="18" fill="#444444">브랜드에 행동</text>
    <path d="M826.6666666666666 325H1050.5855855855855A7 7 0 0 1 1057.5855855855855 332V348A7 7 0 0 1 1050.5855855855855 355H826.6666666666666Z" fill="#111111"/>
    <text x="1069.5855855855855" y="347.92" font-size="22" font-weight="700" fill="#111111">72%</text>
    <line x1="826.6666666666666" y1="219" x2="826.6666666666666" y2="375" stroke="#D9D9D9" stroke-width="1.6"/>
    <line x1="40" y1="397" x2="1160" y2="397" stroke="#D9D9D9" stroke-width="1"/>
    <text x="40" y="423" font-size="16" fill="#6B6B6B">출처: Zappi 분석, Rival Technologies 조사(eMarketer). 두 조사는 대상과 질문이 다르다.</text>
  </g>
