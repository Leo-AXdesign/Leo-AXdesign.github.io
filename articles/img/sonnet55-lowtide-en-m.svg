  <title id="t">What it took to build the same page</title>
  <desc id="d">Cost for the same task: Opus 5.5 $1.94, Sonnet 5.5 $1.35, Sonnet 5 $1.08. Time: 9, 8 and 6 minutes. Output tokens: 45k, 58k, 25k.</desc>
