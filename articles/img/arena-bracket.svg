<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 587" role="img" aria-labelledby="t d">
  <title id="t">Design Arena, 투표 한 번은 이렇게 돈다</title>
  <desc id="d">Design Arena는 같은 요청을 모델 네 개에 보내고, 이름을 가린 채 둘씩 다섯 번 고르게 한다. 1·2판에서 짝지어 고르고, 3판은 이긴 둘끼리 겨뤄 1위를, 4판은 진 둘끼리 겨뤄 4위를 정한다. 5판에서 남은 둘의 2위와 3위가 정해진다.</desc>
  <rect width="1200" height="587" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="40" y="70" font-size="30" font-weight="800" fill="#111111" text-anchor="start">Design Arena, 투표 한 번은 이렇게 돈다</text>
    <text x="40" y="101" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="start">같은 요청을 받은 모델 넷 · 다섯 판을 고르면 1~4위가 정해진다</text>
    <rect x="40.0" y="141" width="250.0" height="236" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <circle cx="66.0" cy="171" r="15" fill="#111111"/><text x="66.0" y="177.12" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="90.0" y="178" font-size="21" font-weight="800" fill="#111111" text-anchor="start">익명으로 넷</text>
    <text x="62.0" y="213" font-size="16" font-weight="400" fill="#444444" text-anchor="start">같은 요청, 이름은 가림</text>
    <rect x="62.0" y="239" width="42" height="42" rx="9" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="83.0" y="267.2" font-size="20" font-weight="800" fill="#111111" text-anchor="middle">A</text>
    <rect x="114.0" y="239" width="42" height="42" rx="9" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="135.0" y="267.2" font-size="20" font-weight="800" fill="#111111" text-anchor="middle">B</text>
    <rect x="166.0" y="239" width="42" height="42" rx="9" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="187.0" y="267.2" font-size="20" font-weight="800" fill="#111111" text-anchor="middle">C</text>
    <rect x="218.0" y="239" width="42" height="42" rx="9" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="239.0" y="267.2" font-size="20" font-weight="800" fill="#111111" text-anchor="middle">D</text>
    <path d="M296.0 259.0h26m-8 -7l8 7l-8 7" fill="none" stroke="#111111" stroke-width="2"/>
    <rect x="330.0" y="141" width="250.0" height="236" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <circle cx="356.0" cy="171" r="15" fill="#111111"/><text x="356.0" y="177.12" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="380.0" y="178" font-size="21" font-weight="800" fill="#111111" text-anchor="start">1 · 2판</text>
    <text x="352.0" y="213" font-size="16" font-weight="400" fill="#444444" text-anchor="start">둘씩 짝지어 고르기</text>
    <rect x="352.0" y="239" width="42" height="42" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/><text x="373.0" y="267.2" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">A</text>
    <text x="409.0" y="266.0" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="middle">vs</text>
