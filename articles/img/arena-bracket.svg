    <rect x="910.0" y="141" width="250.0" height="236" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <circle cx="936.0" cy="171" r="15" fill="#111111"/><text x="936.0" y="177.12" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="960.0" y="178" font-size="21" font-weight="800" fill="#111111" text-anchor="start">5판</text>
    <text x="932.0" y="213" font-size="16" font-weight="400" fill="#444444" text-anchor="start">남은 둘의 자리 정하기</text>
    <rect x="932.0" y="239" width="42" height="42" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/><text x="953.0" y="267.2" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">D</text>
    <text x="989.0" y="266.0" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="middle">vs</text>
    <rect x="1004.0" y="239" width="42" height="42" rx="9" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="1025.0" y="267.2" font-size="20" font-weight="800" fill="#111111" text-anchor="middle">B</text>
    <text x="1060.0" y="265.76" font-size="16" font-weight="700" fill="#111111" text-anchor="start">→ 2위 · 3위</text>
    <text x="40" y="439.56" font-size="21" font-weight="800" fill="#111111" text-anchor="start">결과</text>
    <rect x="150" y="411" width="42" height="42" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/><text x="171.0" y="439.2" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">A</text>
    <text x="200" y="437.76" font-size="16" font-weight="700" fill="#6B6B6B" text-anchor="start">1</text>
    <rect x="262" y="411" width="42" height="42" rx="9" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="283.0" y="439.2" font-size="20" font-weight="800" fill="#111111" text-anchor="middle">D</text>
    <text x="312" y="437.76" font-size="16" font-weight="700" fill="#6B6B6B" text-anchor="start">2</text>
    <rect x="374" y="411" width="42" height="42" rx="9" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="395.0" y="439.2" font-size="20" font-weight="800" fill="#111111" text-anchor="middle">B</text>
    <text x="424" y="437.76" font-size="16" font-weight="700" fill="#6B6B6B" text-anchor="start">3</text>
    <rect x="486" y="411" width="42" height="42" rx="9" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="507.0" y="439.2" font-size="20" font-weight="800" fill="#111111" text-anchor="middle">C</text>
    <text x="536" y="437.76" font-size="16" font-weight="700" fill="#6B6B6B" text-anchor="start">4</text>
    <text x="40" y="487" font-size="16" font-weight="400" fill="#444444" text-anchor="start">모델 이름은 투표가 끝난 뒤에 공개</text>
    <line x1="40" y1="519" x2="1160" y2="519" stroke="#D9D9D9" stroke-width="1"/>
    <text x="40" y="547" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="start">출처: designarena.ai 소개 페이지. 승패는 설명을 위한 예시.</text>
