    <circle cx="646.0" cy="171" r="15" fill="#111111"/><text x="646.0" y="177.12" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="670.0" y="178" font-size="21" font-weight="800" fill="#111111" text-anchor="start">3 · 4판</text>
    <text x="642.0" y="213" font-size="16" font-weight="400" fill="#444444" text-anchor="start">이긴 둘끼리, 진 둘끼리</text>
    <rect x="642.0" y="239" width="42" height="42" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/><text x="663.0" y="267.2" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">A</text>
    <text x="699.0" y="266.0" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="middle">vs</text>
    <rect x="714.0" y="239" width="42" height="42" rx="9" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="735.0" y="267.2" font-size="20" font-weight="800" fill="#111111" text-anchor="middle">D</text>
    <text x="770.0" y="265.76" font-size="16" font-weight="700" fill="#111111" text-anchor="start">→ 1위</text>
    <rect x="642.0" y="297" width="42" height="42" rx="9" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="663.0" y="325.2" font-size="20" font-weight="800" fill="#111111" text-anchor="middle">B</text>
    <text x="699.0" y="324.0" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="middle">vs</text>
    <rect x="714.0" y="297" width="42" height="42" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/><text x="735.0" y="325.2" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">C</text>
    <text x="770.0" y="323.76" font-size="16" font-weight="700" fill="#111111" text-anchor="start">→ 4위</text>
