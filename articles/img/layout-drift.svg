<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
  <title id="t">원본 화면과 틀어진 화면 비교</title>
  <desc id="d">왼쪽은 원본 화면, 오른쪽은 고치기 전의 읽을거리 페이지. 원본의 첫 줄은 173px, 고치기 전 페이지는 238px에서 시작하고, 본문 폭이 73px 좁으며 스크롤바가 없다.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#D2D2D2" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1200" height="680" rx="24" fill="#F3F3F4"/>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <!-- 위 이름표 -->
    <text x="60" y="62" font-size="19" font-weight="700" fill="#111">원본 <tspan font-weight="400" fill="#8A8A8A" font-size="15">  메인 화면에서 본 읽을거리</tspan></text>
    <text x="640" y="62" font-size="19" font-weight="700" fill="#111">고치기 전 <tspan font-weight="400" fill="#8A8A8A" font-size="15">  읽을거리 페이지</tspan></text>

    <!-- ================= 왼쪽: 원본 ================= -->
    <g transform="translate(60 84)">
      <rect width="500" height="500" rx="14" fill="#FFFFFF" stroke="#111" stroke-width="1.5"/>
      <!-- 상단바 -->
      <text x="18" y="30" font-size="20" font-weight="800" fill="#111">d<tspan fill="#A3A3A3">.</tspan></text>
      <rect x="160" y="13" width="180" height="20" rx="10" fill="#F1F1F2"/>
      <circle cx="176" cy="23" r="4" fill="none" stroke="#9A9A9A" stroke-width="1.5"/>
      <circle cx="476" cy="23" r="7" fill="#111"/>
      <line x1="0" y1="44" x2="500" y2="44" stroke="#E6E6E6"/>
      <!-- 메뉴 -->
      <g fill="#DEDEDE">
        <rect x="18" y="62" width="70" height="8" rx="4"/><rect x="18" y="86" width="58" height="8" rx="4"/>
        <rect x="18" y="122" width="66" height="8" rx="4"/><rect x="18" y="146" width="74" height="8" rx="4"/>
        <rect x="18" y="170" width="52" height="8" rx="4"/><rect x="18" y="194" width="62" height="8" rx="4"/>
        <rect x="18" y="218" width="70" height="8" rx="4"/><rect x="18" y="242" width="56" height="8" rx="4"/>
        <rect x="18" y="266" width="64" height="8" rx="4"/><rect x="18" y="290" width="48" height="8" rx="4"/>
        <rect x="18" y="326" width="72" height="8" rx="4"/><rect x="18" y="350" width="60" height="8" rx="4"/>
      </g>
      <rect x="12" y="316" width="84" height="28" rx="6" fill="#111"/>
      <rect x="18" y="326" width="48" height="8" rx="4" fill="#FFFFFF"/>
      <!-- 제목 머리 -->
      <text x="118" y="86" font-size="15" font-weight="700" fill="#111">읽을거리</text>
      <text x="186" y="86" font-size="10" fill="#6B6B6B">5</text>
      <rect x="398" y="79" width="80" height="6" rx="3" fill="#D6D6D6"/>
      <line x1="118" y1="96" x2="478" y2="96" stroke="#111" stroke-width="1.5"/>
      <!-- 목록 -->
      <g>
        <rect x="120" y="113" width="34" height="6" rx="3" fill="#D9D9D9"/><rect x="166" y="109" width="210" height="9" rx="4.5" fill="#333"/><rect x="166" y="125" width="270" height="6" rx="3" fill="#DADADA"/><rect x="440" y="113" width="36" height="6" rx="3" fill="#D9D9D9"/>
        <line x1="118" y1="144" x2="478" y2="144" stroke="#E6E6E6"/>
        <rect x="120" y="161" width="34" height="6" rx="3" fill="#D9D9D9"/><rect x="166" y="157" width="180" height="9" rx="4.5" fill="#333"/><rect x="166" y="173" width="250" height="6" rx="3" fill="#DADADA"/><rect x="440" y="161" width="36" height="6" rx="3" fill="#D9D9D9"/>
        <line x1="118" y1="192" x2="478" y2="192" stroke="#E6E6E6"/>
        <rect x="120" y="209" width="34" height="6" rx="3" fill="#D9D9D9"/><rect x="166" y="205" width="200" height="9" rx="4.5" fill="#333"/><rect x="166" y="221" width="262" height="6" rx="3" fill="#DADADA"/><rect x="440" y="209" width="36" height="6" rx="3" fill="#D9D9D9"/>
        <line x1="118" y1="240" x2="478" y2="240" stroke="#E6E6E6"/>
        <rect x="120" y="257" width="34" height="6" rx="3" fill="#D9D9D9"/><rect x="166" y="253" width="190" height="9" rx="4.5" fill="#333"/><rect x="166" y="269" width="240" height="6" rx="3" fill="#DADADA"/><rect x="440" y="257" width="36" height="6" rx="3" fill="#D9D9D9"/>
        <line x1="118" y1="288" x2="478" y2="288" stroke="#E6E6E6"/>
        <rect x="120" y="305" width="34" height="6" rx="3" fill="#D9D9D9"/><rect x="166" y="301" width="220" height="9" rx="4.5" fill="#333"/><rect x="166" y="317" width="256" height="6" rx="3" fill="#DADADA"/><rect x="440" y="305" width="36" height="6" rx="3" fill="#D9D9D9"/>
        <line x1="118" y1="336" x2="478" y2="336" stroke="#E6E6E6"/>
      </g>
      <!-- 스크롤바 -->
      <rect x="486" y="50" width="8" height="442" rx="4" fill="#EFEFEF"/>
      <rect x="486" y="50" width="8" height="120" rx="4" fill="#C9C9C9"/>
    </g>

    <!-- ================= 오른쪽: 고치기 전 ================= -->
    <g transform="translate(640 84)">
      <rect width="500" height="500" rx="14" fill="#FFFFFF" stroke="#111" stroke-width="1.5"/>
      <!-- 상단바: 검색창 대신 경로 글씨 -->
      <text x="18" y="30" font-size="20" font-weight="800" fill="#111">d<tspan fill="#A3A3A3">.</tspan></text>
      <text x="46" y="28" font-size="11" fill="#6B6B6B">디자인 허브 / 읽을거리</text>
      <line x1="0" y1="44" x2="500" y2="44" stroke="#E6E6E6"/>
      <!-- 메뉴 -->
      <g fill="#DEDEDE">
        <rect x="18" y="62" width="70" height="8" rx="4"/><rect x="18" y="86" width="58" height="8" rx="4"/>
        <rect x="18" y="122" width="66" height="8" rx="4"/><rect x="18" y="146" width="74" height="8" rx="4"/>
        <rect x="18" y="170" width="52" height="8" rx="4"/><rect x="18" y="194" width="62" height="8" rx="4"/>
        <rect x="18" y="218" width="70" height="8" rx="4"/><rect x="18" y="242" width="56" height="8" rx="4"/>
        <rect x="18" y="266" width="64" height="8" rx="4"/><rect x="18" y="290" width="48" height="8" rx="4"/>
        <rect x="18" y="326" width="72" height="8" rx="4"/><rect x="18" y="350" width="60" height="8" rx="4"/>
      </g>
      <rect x="12" y="316" width="84" height="28" rx="6" fill="#111"/>
      <rect x="18" y="326" width="48" height="8" rx="4" fill="#FFFFFF"/>
      <!-- 큰 제목 + 소개문 -->
      <text x="118" y="104" font-size="27" font-weight="800" fill="#111">읽을거리</text>
      <rect x="118" y="116" width="310" height="7" rx="3.5" fill="#DADADA"/>
      <rect x="118" y="129" width="200" height="7" rx="3.5" fill="#DADADA"/>
      <!-- 다른 모양의 목록 -->
      <g>
        <rect x="118" y="164" width="190" height="9" rx="4.5" fill="#333"/><rect x="316" y="166" width="30" height="6" rx="3" fill="#D9D9D9"/><rect x="118" y="180" width="280" height="6" rx="3" fill="#DADADA"/><rect x="118" y="193" width="70" height="5" rx="2.5" fill="#E2E2E2"/>
        <line x1="118" y1="206" x2="448" y2="206" stroke="#E6E6E6"/>
        <rect x="118" y="216" width="170" height="9" rx="4.5" fill="#333"/><rect x="296" y="218" width="30" height="6" rx="3" fill="#D9D9D9"/><rect x="118" y="232" width="260" height="6" rx="3" fill="#DADADA"/><rect x="118" y="245" width="70" height="5" rx="2.5" fill="#E2E2E2"/>
        <line x1="118" y1="258" x2="448" y2="258" stroke="#E6E6E6"/>
        <rect x="118" y="268" width="200" height="9" rx="4.5" fill="#333"/><rect x="326" y="270" width="30" height="6" rx="3" fill="#D9D9D9"/><rect x="118" y="284" width="290" height="6" rx="3" fill="#DADADA"/><rect x="118" y="297" width="70" height="5" rx="2.5" fill="#E2E2E2"/>
        <line x1="118" y1="310" x2="448" y2="310" stroke="#E6E6E6"/>
        <rect x="118" y="320" width="180" height="9" rx="4.5" fill="#333"/><rect x="306" y="322" width="30" height="6" rx="3" fill="#D9D9D9"/><rect x="118" y="336" width="250" height="6" rx="3" fill="#DADADA"/><rect x="118" y="349" width="70" height="5" rx="2.5" fill="#E2E2E2"/>
        <line x1="118" y1="362" x2="448" y2="362" stroke="#E6E6E6"/>
      </g>
      <!-- 좁아진 폭 -->
      <rect x="452" y="46" width="46" height="452" fill="url(#hatch)"/>
      <text transform="translate(479 272) rotate(90)" text-anchor="middle" font-size="12" font-weight="700" fill="#555">폭 −73px · 스크롤바 없음</text>
    </g>

    <!-- ================= 기준선 ================= -->
    <line x1="40" y1="180" x2="1160" y2="180" stroke="#111" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.55"/>
    <line x1="560" y1="238" x2="1160" y2="238" stroke="#111" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.55"/>
    <rect x="569" y="169" width="62" height="22" rx="6" fill="#111"/>
    <text x="600" y="184.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">173px</text>
    <rect x="569" y="227" width="62" height="22" rx="6" fill="#FFFFFF" stroke="#111" stroke-width="1.5"/>
    <text x="600" y="242.5" text-anchor="middle" font-size="12" font-weight="700" fill="#111">238px</text>

    <!-- 아래 설명 -->
    <text x="310" y="618" text-anchor="middle" font-size="15" fill="#555">제목 22px · 첫 줄 173px · 본문 933px</text>
    <text x="890" y="618" text-anchor="middle" font-size="15" fill="#555">제목 44px · 첫 줄 238px · 본문 860px</text>
    <text x="890" y="646" text-anchor="middle" font-size="14" fill="#8A8A8A">글이 적어 스크롤바가 사라지면 화면 전체가 15px 밀린다</text>
  </g>
</svg>
