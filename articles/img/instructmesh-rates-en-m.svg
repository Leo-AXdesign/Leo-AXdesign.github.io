<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 881" role="img" aria-labelledby="t d">
  <title id="t">AI-made 3D models mostly can&#x27;t be used as is</title>
  <desc id="d">About 80% of the regenerated 3D models had structural flaws. Novices using InstructMesh found and fixed them about 90% of the time.</desc>
  <rect width="600" height="881" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="32" y="68" font-size="36" font-weight="800" fill="#111111" letter-spacing="-0.5">AI-made 3D models mostly can&#x27;t be used as is</text>
    <text x="32" y="102" font-size="22" fill="#6B6B6B">MIT CSAIL experiment</text>
    <text x="32" y="136" font-size="22" fill="#6B6B6B">popular Thingiverse models regenerated with TRELLIS</text>
    <text x="32" y="206" font-size="30" font-weight="700" fill="#111111">Models with structural flaws</text>
    <text x="32" y="238" font-size="22" fill="#6B6B6B">straight from the AI</text>
    <text x="32" y="291" font-size="23" fill="#444444">Flawed</text>
    <path d="M32 303H441.0A7 7 0 0 1 448.0 310V332A7 7 0 0 1 441.0 339H32Z" fill="#111111"/>
    <text x="462.0" y="331.08" font-size="28" font-weight="700" fill="#111111">~80%</text>
    <text x="32" y="385" font-size="23" fill="#444444">Fine</text>
    <path d="M32 397H129.0A7 7 0 0 1 136.0 404V426A7 7 0 0 1 129.0 433H32Z" fill="#111111"/>
    <text x="150.0" y="425.08" font-size="28" font-weight="700" fill="#111111">~20%</text>
    <line x1="32" y1="268" x2="32" y2="456" stroke="#D9D9D9" stroke-width="1.8"/>
    <text x="32" y="530" font-size="30" font-weight="700" fill="#111111">Fixed by novices</text>
    <text x="32" y="562" font-size="22" fill="#6B6B6B">using InstructMesh</text>
    <text x="32" y="615" font-size="23" fill="#444444">Fixed</text>
    <path d="M32 627H441.0A7 7 0 0 1 448.0 634V656A7 7 0 0 1 441.0 663H32Z" fill="#111111"/>
    <text x="462.0" y="655.08" font-size="28" font-weight="700" fill="#111111">~90%</text>
    <text x="32" y="709" font-size="23" fill="#444444">Not fixed</text>
    <path d="M32 721H71.22222222222223A7 7 0 0 1 78.22222222222223 728V750A7 7 0 0 1 71.22222222222223 757H32Z" fill="#111111"/>
    <text x="92.22222222222223" y="749.08" font-size="28" font-weight="700" fill="#111111">~10%</text>
    <line x1="32" y1="592" x2="32" y2="780" stroke="#D9D9D9" stroke-width="1.8"/>
    <line x1="32" y1="798" x2="568" y2="798" stroke="#D9D9D9" stroke-width="1"/>
    <text x="32" y="824" font-size="19" fill="#6B6B6B">Sources: MIT News (Oct 1, 2026), arXiv 2608.28534.</text>
    <text x="32" y="853" font-size="19" fill="#6B6B6B">12 novice participants; fixes checked by an expert.</text>
  </g>
</svg>
