<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1101" role="img" aria-labelledby="t d">
  <title id="t">그림이 그려지는 동안, 옆에 붙는 광고</title>
  <desc id="d">챗GPT가 그림을 만드는 동안, 만든 그림과 떨어진 자리에 광고라고 표시된 이미지 광고가 붙는다. 제품을 쓰는 장면이나 관련 경험을 &#x27;영감&#x27;처럼 보여 주는 형식이다.</desc>
  <rect width="600" height="1101" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="32" y="66" font-size="34" font-weight="800" fill="#111111" text-anchor="start">그림이 그려지는 동안, 옆에 붙는 광고</text>
    <text x="32" y="99" font-size="21" font-weight="400" fill="#6B6B6B" text-anchor="start">발표를 바탕으로 그린 구조도. 실제 화면과는 다를 수 있다.</text>
    <rect x="32" y="131" width="536" height="760" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <line x1="32" y1="171" x2="568" y2="171" stroke="#D9D9D9" stroke-width="1.5"/>
    <circle cx="56" cy="151" r="5" fill="#D9D9D9"/>
    <circle cx="74" cy="151" r="5" fill="#D9D9D9"/>
    <circle cx="92" cy="151" r="5" fill="#D9D9D9"/>
    <text x="300.0" y="157" font-size="16" font-weight="700" fill="#6B6B6B" text-anchor="middle">ChatGPT</text>
    <rect x="88.63999999999999" y="191" width="459.36" height="40" rx="20.0" fill="#111111"/>
    <text x="106.63999999999999" y="214" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="start">캠핑장 저녁 풍경, 따뜻한 조명으로 그려 줘</text>
    <rect x="52" y="253" width="496" height="300" rx="12" fill="#F2F2F2" stroke="#111111" stroke-width="1.5"/>
    <path d="M52 463.0L200.79999999999998 358.0L300.0 418.0L409.12 343.0L548 448.0V541Q548 553 536 553H64Q52 553 52 541Z" fill="#D9D9D9"/>
    <path d="M240.48 517.0L290.08 439.0L339.68 517.0Z" fill="#111111"/>
    <circle cx="448.8" cy="313.0" r="21.000000000000004" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <text x="68" y="283" font-size="18" font-weight="700" fill="#111111" text-anchor="start">내가 요청한 그림</text>
    <rect x="52" y="589" width="496" height="250" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.5" stroke-dasharray="7 5"/>
    <rect x="66" y="603" width="61.800000000000004" height="30" rx="15.0" fill="#111111"/>
    <text x="78" y="623" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="start">광고</text>
    <rect x="66" y="647" width="468" height="90.0" rx="8" fill="#F2F2F2"/>
    <rect x="282.0" y="669.5" width="36" height="49.50000000000001" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <path d="M290.0 669.5Q300.0 651.5 310.0 669.5" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="66" y="769.0" font-size="18" font-weight="700" fill="#111111" text-anchor="start">브랜드 랜턴</text>
    <text x="66" y="795.0" font-size="16" font-weight="400" fill="#444444" text-anchor="start">제품을 쓰는 장면,</text>
    <text x="66" y="821.0" font-size="16" font-weight="400" fill="#444444" text-anchor="start">&#x27;영감&#x27;으로 제시</text>
    <circle cx="544" cy="593" r="15" fill="#111111"/><text x="544" y="599.12" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
    <circle cx="300.0" cy="571" r="15" fill="#111111"/><text x="300.0" y="577.12" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
    <circle cx="47" cy="923.8" r="14" fill="#111111"/><text x="47" y="929.56" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="72" y="931" font-size="20" font-weight="400" fill="#444444" text-anchor="start">광고라고 분명히 표시</text>
    <circle cx="47" cy="961.8" r="14" fill="#111111"/><text x="47" y="967.56" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="72" y="969" font-size="20" font-weight="400" fill="#444444" text-anchor="start">만든 그림과 떨어진 자리</text>
    <circle cx="47" cy="999.8" r="14" fill="#111111"/><text x="47" y="1005.56" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="72" y="1007" font-size="20" font-weight="400" fill="#444444" text-anchor="start">답변 내용에는 영향 없음</text>
