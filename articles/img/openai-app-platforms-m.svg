    <rect x="187.0" y="664" width="32" height="14" rx="7" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="230.0" y="676" font-size="19" font-weight="400" fill="#444444" text-anchor="start">종료</text>
    <rect x="303.0" y="664" width="32" height="14" rx="7" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="346.0" y="676" font-size="19" font-weight="400" fill="#444444" text-anchor="start">종료 예정</text>
    <line x1="32" y1="698" x2="568" y2="698" stroke="#D9D9D9" stroke-width="1"/>
    <text x="32" y="722" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">출처: OpenAI 발표, antihype.com.br 정리 (2026. 9. 30 기준)</text>
