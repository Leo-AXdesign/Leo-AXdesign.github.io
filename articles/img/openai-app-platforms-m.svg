<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 754" role="img" aria-labelledby="t d">
  <title id="t">챗GPT 앱 플랫폼, 3년 동안 네 번</title>
  <desc id="d">플러그인은 2023년 3월에 시작해 2024년 4월에 닫았다. GPTs와 GPT 스토어는 2023년 11월에 시작해 2026년 12월 11일에 닫는다. Apps SDK는 2025년 10월, 플러그인 익스텐션은 2026년 9월에 나왔다.</desc>
  <rect width="600" height="754" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="32" y="66" font-size="34" font-weight="800" fill="#111111" text-anchor="start">챗GPT 앱 플랫폼, 3년 동안 네 번</text>
    <text x="32" y="99" font-size="21" font-weight="400" fill="#6B6B6B" text-anchor="start">시작한 때부터 닫은(닫을) 때까지</text>
    <line x1="32.0" y1="155" x2="32.0" y2="607" stroke="#D9D9D9" stroke-width="1"/>
    <text x="32.0" y="145" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="start">2023</text>
    <line x1="166.0" y1="155" x2="166.0" y2="607" stroke="#D9D9D9" stroke-width="1"/>
    <text x="166.0" y="145" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="middle">2024</text>
    <line x1="300.0" y1="155" x2="300.0" y2="607" stroke="#D9D9D9" stroke-width="1"/>
    <text x="300.0" y="145" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="middle">2025</text>
    <line x1="434.0" y1="155" x2="434.0" y2="607" stroke="#D9D9D9" stroke-width="1"/>
    <text x="434.0" y="145" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="middle">2026</text>
    <line x1="568.0" y1="155" x2="568.0" y2="607" stroke="#D9D9D9" stroke-width="1"/>
    <text x="568.0" y="145" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="end">2027</text>
    <text x="32" y="193" font-size="24" font-weight="700" fill="#111111" text-anchor="start">플러그인</text>
    <text x="32" y="222" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="start">2023. 3 → 2024. 4 종료</text>
    <rect x="54.33333333334349" y="238" width="145.1666666666565" height="22" rx="11.0" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="32" y="305" font-size="24" font-weight="700" fill="#111111" text-anchor="start">GPTs · GPT 스토어</text>
    <text x="32" y="334" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="start">2023. 11 → 2026. 12. 11 종료 예정</text>
    <rect x="143.6666666666565" y="350" width="390.4983333333362" height="22" rx="11.0" fill="#111111"/>
    <rect x="523.1649999999927" y="350" width="37.5766666666882" height="22" rx="11.0" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="143.6666666666565" y="350" width="390.4983333333362" height="22" rx="11.0" fill="#111111"/>
    <text x="32" y="417" font-size="24" font-weight="700" fill="#111111" text-anchor="start">Apps SDK</text>
    <text x="32" y="446" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="start">2025. 10 →</text>
    <rect x="400.5" y="462" width="133.6649999999927" height="22" rx="11.0" fill="#111111"/>
    <text x="32" y="529" font-size="24" font-weight="700" fill="#111111" text-anchor="start">플러그인 익스텐션</text>
    <text x="32" y="558" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="start">2026. 9 새로</text>
    <rect x="533.9416666666748" y="574" width="22.0" height="22" rx="11.0" fill="#111111"/>
    <line x1="534.1649999999927" y1="155" x2="534.1649999999927" y2="621" stroke="#111111" stroke-width="1.5" stroke-dasharray="3 4"/>
