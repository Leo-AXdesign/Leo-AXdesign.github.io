  <title id="t">디자이너의 AI, 1년 사이</title>
  <desc id="d">매주 AI를 쓰는 디자이너는 2025년 54%에서 2026년 91%로 늘었다. 평소 쓰는 AI 도구 수는 평균 3개에서 7개로. 가장 많이 쓰는 모델은 Claude 78%, ChatGPT 65%.</desc>
