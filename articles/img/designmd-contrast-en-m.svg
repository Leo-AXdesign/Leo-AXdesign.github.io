<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 839" role="img" aria-labelledby="t d">
  <title id="t">Text contrast on white</title>
  <desc id="d">Contrast on white: #111111 18.9, #2C2C2C 14.0, #6B6B6B 5.3, #767676 4.5, #A3A3A3 2.5. Only #A3A3A3 falls below 4.5.</desc>
  <rect width="600" height="839" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="32" y="68" font-size="36" font-weight="800" fill="#111111" letter-spacing="-0.5">Text contrast on white</text>
    <text x="32" y="102" font-size="22" fill="#6B6B6B">Four grays on this site plus one candidate</text>
    <text x="32" y="136" font-size="22" fill="#6B6B6B">body text needs 4.5 : 1 or more to pass WCAG AA</text>
    <text x="32" y="206" font-size="30" font-weight="700" fill="#111111">Contrast ratio</text>
    <text x="32" y="238" font-size="22" fill="#6B6B6B">higher is easier to read</text>
    <text x="32" y="291" font-size="23" fill="#444444">#111111 headings</text>
    <path d="M32 303H441.0A7 7 0 0 1 448.0 310V332A7 7 0 0 1 441.0 339H32Z" fill="#111111"/>
    <text x="462.0" y="331.08" font-size="28" font-weight="700" fill="#111111">18.9</text>
    <text x="32" y="385" font-size="23" fill="#444444">#2C2C2C body</text>
    <path d="M32 397H332.81355932203394A7 7 0 0 1 339.81355932203394 404V426A7 7 0 0 1 332.81355932203394 433H32Z" fill="#111111"/>
    <text x="353.81355932203394" y="425.08" font-size="28" font-weight="700" fill="#111111">14.0</text>
    <text x="32" y="479" font-size="23" fill="#444444">#6B6B6B descriptions</text>
    <path d="M32 491H142.4406779661017A7 7 0 0 1 149.4406779661017 498V520A7 7 0 0 1 142.4406779661017 527H32Z" fill="#111111"/>
    <text x="163.4406779661017" y="519.08" font-size="28" font-weight="700" fill="#111111">5.3</text>
    <text x="32" y="573" font-size="23" fill="#444444">#767676 candidate</text>
    <path d="M32 585H125.03389830508476A7 7 0 0 1 132.03389830508476 592V614A7 7 0 0 1 125.03389830508476 621H32Z" fill="#111111"/>
    <text x="146.03389830508476" y="613.08" font-size="28" font-weight="700" fill="#111111">4.5</text>
    <text x="32" y="667" font-size="23" fill="#444444">#A3A3A3 domains, tags</text>
    <path d="M32 679H80.52542372881356A7 7 0 0 1 87.52542372881356 686V708A7 7 0 0 1 80.52542372881356 715H32Z" fill="#111111"/>
    <text x="101.52542372881356" y="707.08" font-size="28" font-weight="700" fill="#111111">2.5 ✕</text>
    <line x1="32" y1="268" x2="32" y2="738" stroke="#D9D9D9" stroke-width="1.8"/>
    <line x1="32" y1="756" x2="568" y2="756" stroke="#D9D9D9" stroke-width="1"/>
    <text x="32" y="782" font-size="19" fill="#6B6B6B">Checked with design.md lint 0.4.0. Values are WCAG contrast ratios.</text>
    <text x="32" y="811" font-size="19" fill="#6B6B6B">#767676 is a candidate replacement.</text>
  </g>
</svg>
