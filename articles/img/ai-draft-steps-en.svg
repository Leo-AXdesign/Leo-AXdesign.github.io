<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 445" role="img" aria-labelledby="t d">
  <title id="t">Four steps when an AI draft arrives</title>
  <desc id="d">When a client sends an AI draft: check which AI made it and whether commercial use is allowed, split what to keep from what to redo, quote by the list of remaining work, then record it all in writing.</desc>
  <rect width="1200" height="445" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="40" y="70" font-size="30" font-weight="800" fill="#111111" text-anchor="start">Four steps when an AI draft arrives</text>
    <text x="40" y="101" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="start">A useful order before you quote</text>
    <rect x="40.0" y="141" width="247.0" height="200" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <circle cx="66.0" cy="171" r="15" fill="#111111"/><text x="66.0" y="177.12" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="90.0" y="178" font-size="21" font-weight="800" fill="#111111" text-anchor="start">Check</text>
    <text x="62.0" y="225" font-size="16" font-weight="400" fill="#444444" text-anchor="start">Which AI made it</text>
    <text x="62.0" y="255" font-size="16" font-weight="400" fill="#444444" text-anchor="start">Commercial use allowed?</text>
    <text x="62.0" y="285" font-size="16" font-weight="400" fill="#444444" text-anchor="start">Any lookalikes?</text>
    <path d="M295.0 241.0h26m-8 -7l8 7l-8 7" fill="none" stroke="#111111" stroke-width="2"/>
    <rect x="331.0" y="141" width="247.0" height="200" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <circle cx="357.0" cy="171" r="15" fill="#111111"/><text x="357.0" y="177.12" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="381.0" y="178" font-size="21" font-weight="800" fill="#111111" text-anchor="start">Split</text>
    <text x="353.0" y="225" font-size="16" font-weight="400" fill="#444444" text-anchor="start">Keep: direction, mood</text>
    <text x="353.0" y="255" font-size="16" font-weight="400" fill="#444444" text-anchor="start">Redo: type, logo</text>
    <text x="353.0" y="285" font-size="16" font-weight="400" fill="#444444" text-anchor="start">New: files, formats</text>
    <path d="M586.0 241.0h26m-8 -7l8 7l-8 7" fill="none" stroke="#111111" stroke-width="2"/>
    <rect x="622.0" y="141" width="247.0" height="200" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <circle cx="648.0" cy="171" r="15" fill="#111111"/><text x="648.0" y="177.12" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="672.0" y="178" font-size="21" font-weight="800" fill="#111111" text-anchor="start">Quote</text>
    <text x="644.0" y="225" font-size="16" font-weight="400" fill="#444444" text-anchor="start">Not by hours</text>
    <text x="644.0" y="255" font-size="16" font-weight="400" fill="#444444" text-anchor="start">but by the list of work</text>
    <text x="644.0" y="285" font-size="16" font-weight="400" fill="#444444" text-anchor="start">Include revision rounds</text>
    <path d="M877.0 241.0h26m-8 -7l8 7l-8 7" fill="none" stroke="#111111" stroke-width="2"/>
    <rect x="913.0" y="141" width="247.0" height="200" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <circle cx="939.0" cy="171" r="15" fill="#111111"/><text x="939.0" y="177.12" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="963.0" y="178" font-size="21" font-weight="800" fill="#111111" text-anchor="start">Record</text>
    <text x="935.0" y="225" font-size="16" font-weight="400" fill="#444444" text-anchor="start">What you received</text>
    <text x="935.0" y="255" font-size="16" font-weight="400" fill="#444444" text-anchor="start">and what you made,</text>
    <text x="935.0" y="285" font-size="16" font-weight="400" fill="#444444" text-anchor="start">in one email</text>
    <line x1="40" y1="377" x2="1160" y2="377" stroke="#D9D9D9" stroke-width="1"/>
    <text x="40" y="405" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="start">The order laid out in this article</text>
  </g>
</svg>
