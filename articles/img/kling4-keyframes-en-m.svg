<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 537" role="img" aria-labelledby="t d">
  <title id="t">Two frames become ten</title>
  <desc id="d">With Kling 3.0, you gave a first and last frame and the AI filled up to 15 seconds between. Kling 4.0 lets you pin up to 10 keyframes across up to 30 seconds to set the flow of a scene.</desc>
  <rect width="600" height="537" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="32" y="66" font-size="28" font-weight="800" fill="#111111" text-anchor="start">Two frames become ten</text>
    <text x="32" y="99" font-size="21" font-weight="400" fill="#6B6B6B" text-anchor="start">A conceptual sketch based on Kling&#x27;s published specs</text>
    <text x="32" y="151" font-size="24" font-weight="800" fill="#111111" text-anchor="start">Kling 3.0</text>
    <text x="32" y="179" font-size="18" font-weight="400" fill="#444444" text-anchor="start">First and last frame · up to 15 s</text>
    <rect x="32" y="218.0" width="268.0" height="6" rx="3" fill="#D9D9D9"/>
    <rect x="32.0" y="201" width="56.0" height="40" rx="5" fill="#111111"/>
    <circle cx="51.6" cy="223.0" r="6.4" fill="#FFFFFF"/>
    <rect x="244.0" y="201" width="56.0" height="40" rx="5" fill="#111111"/>
    <circle cx="263.6" cy="223.0" r="6.4" fill="#FFFFFF"/>
    <text x="166.0" y="211.0" font-size="17" font-weight="400" fill="#6B6B6B" text-anchor="middle">AI fills in between</text>
    <text x="32.0" y="275" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="start">0s</text>
    <text x="121.33333333333333" y="275" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="middle">5s</text>
    <text x="210.66666666666666" y="275" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="middle">10s</text>
    <text x="300.0" y="275" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="middle">15s</text>
    <text x="32" y="321" font-size="24" font-weight="800" fill="#111111" text-anchor="start">Kling 4.0</text>
    <text x="32" y="349" font-size="18" font-weight="400" fill="#444444" text-anchor="start">Up to 10 keyframes · up to 30 s</text>
