    <text x="32" y="99" font-size="21" font-weight="400" fill="#6B6B6B" text-anchor="start">ArtCraft 저장소와 보도 기준, 10월 9일.</text>
    <text x="32" y="130" font-size="21" font-weight="400" fill="#6B6B6B" text-anchor="start">상태는 자주 바뀐다</text>
