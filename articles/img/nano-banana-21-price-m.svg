<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1239" role="img" aria-labelledby="t d">
  <title id="t">1K·2K는 절반, 4K는 4분의 1만 내렸다</title>
  <desc id="d">이미지 한 장 값. 1K는 나노 바나나 2가 0.067달러, 2.1이 0.0336달러. 2K는 0.101달러에서 0.0504달러. 4K는 0.151달러에서 0.113달러.</desc>
