<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1031" role="img" aria-labelledby="t d">
  <title id="t">AI가 그리는 화면, 규칙은 어디서 오나</title>
  <desc id="d">챗GPT Intelligent UI는 오픈AI의 부품 모음을 GPT-6가 질문마다 조립해 대화 속 화면을 만든다. 피그마 에이전트는 팀의 디자인 라이브러리와 가이드라인 마크다운 파일을 매번 읽고 팀 파일 안에서 작업한다.</desc>
  <rect width="600" height="1031" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="32" y="66" font-size="34" font-weight="800" fill="#111111" text-anchor="start">AI가 그리는 화면, 규칙은 어디서 오나</text>
    <text x="32" y="99" font-size="21" font-weight="400" fill="#6B6B6B" text-anchor="start">같은 주에 나온 두 기능의 구조 비교</text>
    <text x="32" y="143" font-size="24" font-weight="800" fill="#111111" text-anchor="start">챗GPT Intelligent UI</text>
    <rect x="32" y="157" width="215.0" height="30" rx="15" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <text x="46" y="177" font-size="17" font-weight="700" fill="#111111" text-anchor="start">규칙 주인: 오픈AI</text>
    <rect x="32" y="207" width="536" height="84" rx="12" fill="#F2F2F2" stroke="#111111" stroke-width="2"/>
    <text x="52" y="243" font-size="20" font-weight="700" fill="#111111" text-anchor="start">오픈AI가 만든 부품 모음</text>
    <text x="52" y="271" font-size="17" font-weight="400" fill="#6B6B6B" text-anchor="start">버튼 · 폼 · 차트 · 작은 도구</text>
    <line x1="300.0" y1="295" x2="300.0" y2="313" stroke="#111111" stroke-width="2"/>
    <path d="M293.0 307 L300.0 317 L307.0 307" fill="none" stroke="#111111" stroke-width="2"/>
    <rect x="32" y="321" width="536" height="84" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <text x="52" y="357" font-size="20" font-weight="700" fill="#111111" text-anchor="start">GPT-6가 질문마다 조립</text>
    <text x="52" y="385" font-size="17" font-weight="400" fill="#6B6B6B" text-anchor="start">어떤 모양이 맞을지 모델이 판단</text>
    <line x1="300.0" y1="409" x2="300.0" y2="427" stroke="#111111" stroke-width="2"/>
    <path d="M293.0 421 L300.0 431 L307.0 421" fill="none" stroke="#111111" stroke-width="2"/>
    <rect x="32" y="435" width="536" height="84" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <text x="52" y="471" font-size="20" font-weight="700" fill="#111111" text-anchor="start">대화 속 답 화면</text>
    <text x="52" y="499" font-size="17" font-weight="400" fill="#6B6B6B" text-anchor="start">모든 사용자에게 같은 디자인</text>
    <text x="32" y="569" font-size="24" font-weight="800" fill="#111111" text-anchor="start">피그마 에이전트</text>
    <rect x="32" y="583" width="215.0" height="30" rx="15" fill="#111111" stroke="#111111" stroke-width="1.5"/>
    <text x="46" y="603" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">규칙 주인: 우리 팀</text>
    <rect x="32" y="633" width="536" height="84" rx="12" fill="#F2F2F2" stroke="#111111" stroke-width="2"/>
    <text x="52" y="669" font-size="20" font-weight="700" fill="#111111" text-anchor="start">우리 팀 디자인 라이브러리</text>
    <text x="52" y="697" font-size="17" font-weight="400" fill="#6B6B6B" text-anchor="start">+ 가이드라인 마크다운 파일</text>
    <line x1="300.0" y1="721" x2="300.0" y2="739" stroke="#111111" stroke-width="2"/>
    <path d="M293.0 733 L300.0 743 L307.0 733" fill="none" stroke="#111111" stroke-width="2"/>
    <rect x="32" y="747" width="536" height="84" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <text x="52" y="783" font-size="20" font-weight="700" fill="#111111" text-anchor="start">에이전트가 매번 읽고 작업</text>
    <text x="52" y="811" font-size="17" font-weight="400" fill="#6B6B6B" text-anchor="start">규칙 · 모범 사례 · 금지 사례</text>
    <line x1="300.0" y1="835" x2="300.0" y2="853" stroke="#111111" stroke-width="2"/>
    <path d="M293.0 847 L300.0 857 L307.0 847" fill="none" stroke="#111111" stroke-width="2"/>
    <rect x="32" y="861" width="536" height="84" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <text x="52" y="897" font-size="20" font-weight="700" fill="#111111" text-anchor="start">우리 파일 속 화면</text>
    <text x="52" y="925" font-size="17" font-weight="400" fill="#6B6B6B" text-anchor="start">우리 브랜드 디자인</text>
    <line x1="32" y1="975" x2="568" y2="975" stroke="#D9D9D9" stroke-width="1"/>
    <text x="32" y="999" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="start">출처: OpenAI 발표(2026. 10. 7), 피그마 릴리스 노트(2026. 10. 6)</text>
  </g>
</svg>
