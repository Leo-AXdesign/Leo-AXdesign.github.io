<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 615" role="img" aria-labelledby="t d">
  <title id="t">피그마 요금제별 월 AI 크레딧</title>
  <desc id="d">풀 좌석 월 AI 크레딧은 스타터 500, 프로페셔널 3,000, 조직 3,500, 엔터프라이즈 4,250이다.</desc>
  <rect width="1200" height="615" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="40" y="70" font-size="30" font-weight="800" fill="#111111" letter-spacing="-0.5">피그마 요금제별 월 AI 크레딧</text>
    <text x="40" y="101" font-size="19" fill="#6B6B6B">풀 좌석 기준 · 스타터는 월 최대치</text>
    <text x="40.0" y="165" font-size="24" font-weight="700" fill="#111111">풀 좌석 월 AI 크레딧</text>
    <text x="40.0" y="193" font-size="18" fill="#6B6B6B">높을수록 많음</text>
    <text x="40.0" y="237" font-size="18" fill="#444444">스타터</text>
    <path d="M40.0 247H153.47058823529412A7 7 0 0 1 160.47058823529412 254V270A7 7 0 0 1 153.47058823529412 277H40.0Z" fill="#111111"/>
    <text x="172.47058823529412" y="269.92" font-size="22" font-weight="700" fill="#111111">500</text>
    <text x="40.0" y="315" font-size="18" fill="#444444">프로페셔널</text>
    <path d="M40.0 325H755.8235294117648A7 7 0 0 1 762.8235294117648 332V348A7 7 0 0 1 755.8235294117648 355H40.0Z" fill="#111111"/>
    <text x="774.8235294117648" y="347.92" font-size="22" font-weight="700" fill="#111111">3,000</text>
    <text x="40.0" y="393" font-size="18" fill="#444444">조직</text>
    <path d="M40.0 403H876.2941176470588A7 7 0 0 1 883.2941176470588 410V426A7 7 0 0 1 876.2941176470588 433H40.0Z" fill="#111111"/>
