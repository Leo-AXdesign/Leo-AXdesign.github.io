    <text x="40.0" y="471" font-size="18" fill="#444444">엔터프라이즈</text>
    <path d="M40.0 481H1057.0A7 7 0 0 1 1064.0 488V504A7 7 0 0 1 1057.0 511H40.0Z" fill="#111111"/>
    <text x="1076.0" y="503.92" font-size="22" font-weight="700" fill="#111111">4,250</text>
    <line x1="40.0" y1="219" x2="40.0" y2="531" stroke="#D9D9D9" stroke-width="1.6"/>
    <line x1="40" y1="553" x2="1160" y2="553" stroke="#D9D9D9" stroke-width="1"/>
    <text x="40" y="579" font-size="16" fill="#6B6B6B">출처: Figma 요금 페이지 (2026-10-18 확인). Dev·Collab 좌석은 모든 요금제에서 월 500.</text>
