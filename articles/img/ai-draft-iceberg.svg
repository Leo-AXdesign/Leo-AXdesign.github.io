<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 753" role="img" aria-labelledby="t d">
  <title id="t">&quot;이것만 다듬어 주세요&quot; 아래에 남은 일</title>
  <desc id="d">클라이언트가 보낸 AI 시안은 결과물의 일부만 보여 준다. 그 아래에는 권리 확인, 고칠 수 있는 파일로 다시 만들기, 글자 다시 짜기, 브랜드 맞추기, 매체별 파일, 수정 대응이 남아 있다.</desc>
  <rect width="1200" height="753" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="40" y="70" font-size="30" font-weight="800" fill="#111111" text-anchor="start">&quot;이것만 다듬어 주세요&quot; 아래에 남은 일</text>
    <text x="40" y="101" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="start">클라이언트가 AI로 만든 시안을 보낼 때. 개념도</text>
    <text x="40" y="161" font-size="21" font-weight="800" fill="#111111" text-anchor="start">보이는 부분</text>
    <rect x="420.0" y="177" width="360" height="120" rx="10" fill="#F2F2F2" stroke="#111111" stroke-width="2"/>
    <circle cx="700.8" cy="215.4" r="15.600000000000001" fill="#D9D9D9"/>
    <path d="M422.0 295L546.0 231.0L618.0 261.0L679.2 243.0L778.0 295Z" fill="#D9D9D9"/>
    <text x="600.0" y="327" font-size="18" font-weight="700" fill="#444444" text-anchor="middle">AI가 만든 그림 한 장</text>
    <path d="M40 355q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="1160" y="345" font-size="14" font-weight="400" fill="#6B6B6B" text-anchor="end">수면</text>
    <text x="40" y="405" font-size="21" font-weight="800" fill="#111111" text-anchor="start">실제로 남은 일</text>
    <rect x="40.0" y="425" width="361.3333333333333" height="104" rx="12" fill="#111111"/>
    <text x="60.0" y="461" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="start">권리 확인</text>
    <text x="60.0" y="489" font-size="15" font-weight="400" fill="#D9D9D9" text-anchor="start">상업적으로 써도 되나, 닮은</text>
    <text x="60.0" y="513" font-size="15" font-weight="400" fill="#D9D9D9" text-anchor="start">로고·인물은 없나</text>
    <rect x="419.3333333333333" y="425" width="361.3333333333333" height="104" rx="12" fill="#111111"/>
    <text x="439.3333333333333" y="461" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="start">다시 만들기</text>
    <text x="439.3333333333333" y="489" font-size="15" font-weight="400" fill="#D9D9D9" text-anchor="start">해상도, 벡터, 레이어. 고칠 수</text>
    <text x="439.3333333333333" y="513" font-size="15" font-weight="400" fill="#D9D9D9" text-anchor="start">있는 파일로</text>
    <rect x="798.6666666666666" y="425" width="361.3333333333333" height="104" rx="12" fill="#111111"/>
    <text x="818.6666666666666" y="461" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="start">글자 다시 짜기</text>
    <text x="818.6666666666666" y="489" font-size="15" font-weight="400" fill="#D9D9D9" text-anchor="start">AI가 그린 글자는 대개 쓸 수 없다</text>
    <rect x="40.0" y="547" width="361.3333333333333" height="104" rx="12" fill="#111111"/>
    <text x="60.0" y="583" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="start">브랜드 맞추기</text>
    <text x="60.0" y="611" font-size="15" font-weight="400" fill="#D9D9D9" text-anchor="start">색·서체·간격을 가이드에 맞게</text>
    <rect x="419.3333333333333" y="547" width="361.3333333333333" height="104" rx="12" fill="#111111"/>
    <text x="439.3333333333333" y="583" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="start">매체별 파일</text>
    <text x="439.3333333333333" y="611" font-size="15" font-weight="400" fill="#D9D9D9" text-anchor="start">인쇄·웹·SNS 크기와 형식</text>
    <rect x="798.6666666666666" y="547" width="361.3333333333333" height="104" rx="12" fill="#111111"/>
    <text x="818.6666666666666" y="583" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="start">수정 대응</text>
    <text x="818.6666666666666" y="611" font-size="15" font-weight="400" fill="#D9D9D9" text-anchor="start">&quot;조금만 더&quot;가 몇 번 오갈지</text>
    <line x1="40" y1="685" x2="1160" y2="685" stroke="#D9D9D9" stroke-width="1"/>
    <text x="40" y="713" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="start">출처: Fast Company(2026. 10. 12) 디자이너 인터뷰를 바탕으로 정리</text>
  </g>
</svg>
