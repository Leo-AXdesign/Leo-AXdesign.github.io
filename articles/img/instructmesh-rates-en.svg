<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 459" role="img" aria-labelledby="t d">
  <title id="t">AI-made 3D models mostly can&#x27;t be used as is</title>
  <desc id="d">About 80% of the regenerated 3D models had structural flaws. Novices using InstructMesh found and fixed them about 90% of the time.</desc>
  <rect width="1200" height="459" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="40" y="70" font-size="30" font-weight="800" fill="#111111" letter-spacing="-0.5">AI-made 3D models mostly can&#x27;t be used as is</text>
    <text x="40" y="101" font-size="19" fill="#6B6B6B">MIT CSAIL experiment · popular Thingiverse models regenerated with TRELLIS</text>
    <text x="40.0" y="165" font-size="24" font-weight="700" fill="#111111">Models with structural flaws</text>
    <text x="40.0" y="193" font-size="18" fill="#6B6B6B">straight from the AI</text>
    <text x="40.0" y="237" font-size="18" fill="#444444">Flawed</text>
    <path d="M40.0 247H467.0A7 7 0 0 1 474.0 254V270A7 7 0 0 1 467.0 277H40.0Z" fill="#111111"/>
    <text x="486.0" y="269.92" font-size="22" font-weight="700" fill="#111111">~80%</text>
    <text x="40.0" y="315" font-size="18" fill="#444444">Fine</text>
    <path d="M40.0 325H141.5A7 7 0 0 1 148.5 332V348A7 7 0 0 1 141.5 355H40.0Z" fill="#111111"/>
    <text x="160.5" y="347.92" font-size="22" font-weight="700" fill="#111111">~20%</text>
    <line x1="40.0" y1="219" x2="40.0" y2="375" stroke="#D9D9D9" stroke-width="1.6"/>
    <text x="630.0" y="165" font-size="24" font-weight="700" fill="#111111">Fixed by novices</text>
    <text x="630.0" y="193" font-size="18" fill="#6B6B6B">using InstructMesh</text>
    <text x="630.0" y="237" font-size="18" fill="#444444">Fixed</text>
    <path d="M630.0 247H1057.0A7 7 0 0 1 1064.0 254V270A7 7 0 0 1 1057.0 277H630.0Z" fill="#111111"/>
    <text x="1076.0" y="269.92" font-size="22" font-weight="700" fill="#111111">~90%</text>
    <text x="630.0" y="315" font-size="18" fill="#444444">Not fixed</text>
    <path d="M630.0 325H671.2222222222222A7 7 0 0 1 678.2222222222222 332V348A7 7 0 0 1 671.2222222222222 355H630.0Z" fill="#111111"/>
    <text x="690.2222222222222" y="347.92" font-size="22" font-weight="700" fill="#111111">~10%</text>
    <line x1="630.0" y1="219" x2="630.0" y2="375" stroke="#D9D9D9" stroke-width="1.6"/>
    <line x1="40" y1="397" x2="1160" y2="397" stroke="#D9D9D9" stroke-width="1"/>
    <text x="40" y="423" font-size="16" fill="#6B6B6B">Sources: MIT News (Oct 1, 2026), arXiv 2608.28534. 12 novice participants; fixes checked by an expert.</text>
  </g>
</svg>
