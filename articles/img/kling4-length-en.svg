<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 537" role="img" aria-labelledby="t d">
  <title id="t">Video length in one generation</title>
  <desc id="d">Maximum length per generation: Kling 3.0 15 seconds, Kling 4.0 Flash 20 seconds, Kling 4.0 30 seconds.</desc>
  <rect width="1200" height="537" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="40" y="70" font-size="30" font-weight="800" fill="#111111" letter-spacing="-0.5">Video length in one generation</text>
    <text x="40" y="101" font-size="19" fill="#6B6B6B">Maximum for each model · full Kling 4.0 due later in October</text>
    <text x="40.0" y="165" font-size="24" font-weight="700" fill="#111111">Max length</text>
    <text x="40.0" y="193" font-size="18" fill="#6B6B6B">seconds</text>
    <text x="40.0" y="237" font-size="18" fill="#444444">Kling 3.0</text>
    <path d="M40.0 247H545.0A7 7 0 0 1 552.0 254V270A7 7 0 0 1 545.0 277H40.0Z" fill="#111111"/>
