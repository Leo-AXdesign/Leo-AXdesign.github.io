    <line x1="40.0" y1="219" x2="40.0" y2="453" stroke="#D9D9D9" stroke-width="1.6"/>
    <line x1="40" y1="475" x2="1160" y2="475" stroke="#D9D9D9" stroke-width="1"/>
    <text x="40" y="501" font-size="16" fill="#6B6B6B">Sources: Kling spec sheet (Sep 28, 2026), industry coverage. 4.0 Flash opened first to Ultra yearly subscribers only.</text>
