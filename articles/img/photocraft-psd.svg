<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 459" role="img" aria-labelledby="t d">
  <title id="t">PSD를 열었다 다시 저장하면</title>
  <desc id="d">PhotoCraft로 psd-tools 시험 파일 309개를 열었다 다시 저장했을 때, 307개는 제대로 그려졌고 2개는 그렇지 않았다.</desc>
  <rect width="1200" height="459" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="40" y="70" font-size="30" font-weight="800" fill="#111111" letter-spacing="-0.5">PSD를 열었다 다시 저장하면</text>
    <text x="40" y="101" font-size="19" fill="#6B6B6B">PhotoCraft 저장소의 자체 시험 · psd-tools 시험 파일 309개</text>
    <text x="40.0" y="165" font-size="24" font-weight="700" fill="#111111">다시 저장한 뒤</text>
    <text x="40.0" y="193" font-size="18" fill="#6B6B6B">파일 개수</text>
    <text x="40.0" y="237" font-size="18" fill="#444444">제대로 그려짐</text>
    <path d="M40.0 247H1057.0A7 7 0 0 1 1064.0 254V270A7 7 0 0 1 1057.0 277H40.0Z" fill="#111111"/>
    <text x="1076.0" y="269.92" font-size="22" font-weight="700" fill="#111111">307개</text>
    <text x="40.0" y="315" font-size="18" fill="#444444">문제 있음</text>
    <path d="M40.0 325H63.0A7 7 0 0 1 70.0 332V348A7 7 0 0 1 63.0 355H40.0Z" fill="#111111"/>
    <text x="82.0" y="347.92" font-size="22" font-weight="700" fill="#111111">2개</text>
    <line x1="40.0" y1="219" x2="40.0" y2="375" stroke="#D9D9D9" stroke-width="1.6"/>
    <line x1="40" y1="397" x2="1160" y2="397" stroke="#D9D9D9" stroke-width="1"/>
    <text x="40" y="423" font-size="16" fill="#6B6B6B">출처: PhotoCraft 저장소 README (2026. 10). 개발자 자체 시험. 실제 작업 파일과는 다를 수 있다.</text>
  </g>
</svg>
