<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 559" role="img" aria-labelledby="t d">
  <title id="t">Seven AI-rebuilt apps, today</title>
  <desc id="d">ArtCraft&#x27;s seven apps. PhotoCraft (Photoshop) and PrintCraft (Acrobat) are in early alpha; the five replacing Illustrator, InDesign, Lightroom, Premiere and After Effects are in development.</desc>
  <rect width="1200" height="559" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="40" y="70" font-size="30" font-weight="800" fill="#111111" text-anchor="start">Seven AI-rebuilt apps, today</text>
    <text x="40" y="101" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="start">Per repositories and coverage, Oct 9. Status changes often</text>
    <rect x="40.0" y="135" width="265.0" height="150" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="2.5" stroke-dasharray="0"/>
    <text x="58.0" y="171" font-size="20" font-weight="800" fill="#111111" text-anchor="start">PhotoCraft</text>
    <text x="58.0" y="197" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="start">replaces Photoshop</text>
    <rect x="58.0" y="213" width="119.69999999999999" height="29" rx="14.5" fill="#111111" stroke="#111111" stroke-width="1.5"/>
    <text x="70.0" y="231" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Early alpha</text>
    <text x="58.0" y="267" font-size="14" font-weight="400" fill="#444444" text-anchor="start">Opens and saves PSD/PSB</text>
    <rect x="325.0" y="135" width="265.0" height="150" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="343.0" y="171" font-size="20" font-weight="800" fill="#111111" text-anchor="start">VectorCraft</text>
    <text x="343.0" y="197" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="start">replaces Illustrator</text>
    <rect x="343.0" y="213" width="145.8" height="29" rx="14.5" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <text x="355.0" y="231" font-size="15" font-weight="700" fill="#111111" text-anchor="start">In development</text>
    <rect x="610.0" y="135" width="265.0" height="150" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="628.0" y="171" font-size="20" font-weight="800" fill="#111111" text-anchor="start">DesignCraft</text>
    <text x="628.0" y="197" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="start">replaces InDesign</text>
    <rect x="628.0" y="213" width="145.8" height="29" rx="14.5" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <text x="640.0" y="231" font-size="15" font-weight="700" fill="#111111" text-anchor="start">In development</text>
    <rect x="895.0" y="135" width="265.0" height="150" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="913.0" y="171" font-size="20" font-weight="800" fill="#111111" text-anchor="start">LightCraft</text>
    <text x="913.0" y="197" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="start">replaces Lightroom</text>
    <rect x="913.0" y="213" width="145.8" height="29" rx="14.5" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <text x="925.0" y="231" font-size="15" font-weight="700" fill="#111111" text-anchor="start">In development</text>
    <rect x="40.0" y="305" width="265.0" height="150" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="58.0" y="341" font-size="20" font-weight="800" fill="#111111" text-anchor="start">FilmCraft</text>
    <text x="58.0" y="367" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="start">replaces Premiere</text>
    <rect x="58.0" y="383" width="145.8" height="29" rx="14.5" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <text x="70.0" y="401" font-size="15" font-weight="700" fill="#111111" text-anchor="start">In development</text>
    <rect x="325.0" y="305" width="265.0" height="150" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="343.0" y="341" font-size="20" font-weight="800" fill="#111111" text-anchor="start">EffectCraft</text>
    <text x="343.0" y="367" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="start">replaces After Effects</text>
    <rect x="343.0" y="383" width="145.8" height="29" rx="14.5" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <text x="355.0" y="401" font-size="15" font-weight="700" fill="#111111" text-anchor="start">In development</text>
    <text x="343.0" y="437" font-size="14" font-weight="400" fill="#444444" text-anchor="start">Can&#x27;t open AEP files</text>
    <rect x="610.0" y="305" width="265.0" height="150" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="2.5" stroke-dasharray="0"/>
    <text x="628.0" y="341" font-size="20" font-weight="800" fill="#111111" text-anchor="start">PrintCraft</text>
    <text x="628.0" y="367" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="start">replaces Acrobat</text>
    <rect x="628.0" y="383" width="119.69999999999999" height="29" rx="14.5" fill="#111111" stroke="#111111" stroke-width="1.5"/>
    <text x="640.0" y="401" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Early alpha</text>
    <text x="628.0" y="437" font-size="14" font-weight="400" fill="#444444" text-anchor="start">Some reports: PDFCraft</text>
    <line x1="40" y1="491" x2="1160" y2="491" stroke="#D9D9D9" stroke-width="1"/>
    <text x="40" y="519" font-size="16" font-weight="400" fill="#6B6B6B" text-anchor="start">Sources: ArtCraft repos, Windows Forum, GIGAZINE, Cybernews</text>
  </g>
</svg>
