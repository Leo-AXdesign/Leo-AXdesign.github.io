<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 639" role="img" aria-labelledby="t d">
  <title id="t">한 번에 끄던 스위치가 사라졌다</title>
  <desc id="d">macOS 26에서는 Apple Intelligence 전체를 스위치 하나로 끄고 모델도 지울 수 있었다. macOS 27에서는 그 스위치가 사라져 기능을 하나씩 꺼야 하고, 꺼도 모델 파일은 남는다.</desc>
  <rect width="1200" height="639" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="40" y="70" font-size="30" font-weight="800" fill="#111111" text-anchor="start">한 번에 끄던 스위치가 사라졌다</text>
    <text x="40" y="101" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="start">macOS 26과 27의 &#x27;Apple Intelligence&#x27; 끄기. 보도를 바탕으로 그린 개념도</text>
