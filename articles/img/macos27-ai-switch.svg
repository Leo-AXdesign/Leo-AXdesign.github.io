    <line x1="640.0" y1="443" x2="1140.0" y2="443" stroke="#D9D9D9" stroke-width="1"/>
    <text x="620.0" y="488" font-size="16" font-weight="400" fill="#444444" text-anchor="start">기능마다 따로 끈다. 꺼도 모델(최대 14GB)은 남음</text>
