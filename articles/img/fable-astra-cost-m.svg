<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1205" role="img" aria-labelledby="t d">
  <title id="t">같은 점수, 다른 비용</title>
  <desc id="d">종합 지수는 Claude Fable 5.1과 GPT-6 아스트라 모두 53점. 과제 하나당 비용은 Fable 5.1 7.63달러, 아스트라 3.26달러. 과제 하나당 출력 토큰은 Fable 5.1 약 7만 8천 개, 아스트라 약 2만 7천 개.</desc>
