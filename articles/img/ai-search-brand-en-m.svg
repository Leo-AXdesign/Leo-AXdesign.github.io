<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 877" role="img" aria-labelledby="t d">
  <title id="t">Where AI answers find brands</title>
  <desc id="d">AI reads site text, image descriptions, reviews and articles, and structured data, then answers with summaries, lists and cited links. Brands measure how often and how accurately they appear.</desc>
  <rect width="600" height="877" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="32" y="66" font-size="28" font-weight="800" fill="#111111" text-anchor="start">Where AI answers find brands</text>
    <text x="32" y="99" font-size="21" font-weight="400" fill="#6B6B6B" text-anchor="start">When an AI answer becomes the first screen. A sketch</text>
    <rect x="32" y="139" width="536" height="236" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <text x="54" y="177" font-size="22" font-weight="800" fill="#111111" text-anchor="start">What AI reads</text>
    <rect x="52" y="197" width="496" height="34" rx="8" fill="#F2F2F2"/>
    <text x="66" y="218" font-size="17" font-weight="400" fill="#444444" text-anchor="start">Text on the official site</text>
    <rect x="52" y="241" width="496" height="34" rx="8" fill="#F2F2F2"/>
    <text x="66" y="262" font-size="17" font-weight="400" fill="#444444" text-anchor="start">Image descriptions (alt)</text>
    <rect x="52" y="285" width="496" height="34" rx="8" fill="#F2F2F2"/>
    <text x="66" y="306" font-size="17" font-weight="400" fill="#444444" text-anchor="start">Reviews, articles, forums</text>
    <rect x="52" y="329" width="496" height="34" rx="8" fill="#F2F2F2"/>
    <text x="66" y="350" font-size="17" font-weight="400" fill="#444444" text-anchor="start">Structured data</text>
    <path d="M300.0 385v26m-8 -9l8 9l8 -9" fill="none" stroke="#111111" stroke-width="2"/>
    <rect x="32" y="421" width="536" height="100" rx="50" fill="#111111"/>
    <text x="300.0" y="467" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">AI</text>
    <text x="300.0" y="497" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">ChatGPT · Copilot · Perplexity · Google AI Mode</text>
    <path d="M300.0 531v26m-8 -9l8 9l8 -9" fill="none" stroke="#111111" stroke-width="2"/>
    <rect x="32" y="567" width="536" height="180" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <text x="54" y="605" font-size="22" font-weight="800" fill="#111111" text-anchor="start">What users see</text>
    <text x="54" y="646" font-size="17" font-weight="400" fill="#444444" text-anchor="start">· A one- or two-line summary</text>
    <text x="54" y="686" font-size="17" font-weight="400" fill="#444444" text-anchor="start">· A name in a list</text>
    <text x="54" y="726" font-size="17" font-weight="400" fill="#444444" text-anchor="start">· A few cited links</text>
    <text x="32" y="787" font-size="14" font-weight="700" fill="#111111" text-anchor="start">What brands measure: how often, and how accurately, they&#x27;re mentioned</text>
    <line x1="32" y1="817" x2="568" y2="817" stroke="#D9D9D9" stroke-width="1"/>
    <text x="32" y="845" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="start">Sources: Adobe and Heathrow (Oct 8, 2026), CMSWire, The Next Web</text>
  </g>
</svg>
