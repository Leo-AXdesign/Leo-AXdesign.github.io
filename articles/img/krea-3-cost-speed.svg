    <text x="486.0" y="425.92" font-size="22" font-weight="700" fill="#111111">22,000달러</text>
    <line x1="40.0" y1="219" x2="40.0" y2="453" stroke="#D9D9D9" stroke-width="1.6"/>
    <text x="630.0" y="165" font-size="24" font-weight="700" fill="#111111">편집 한 건 시간 (초)</text>
    <text x="630.0" y="193" font-size="18" fill="#6B6B6B">낮을수록 좋음</text>
    <text x="630.0" y="237" font-size="18" fill="#444444">Krea 3</text>
    <path d="M630.0 247H661.5777777777778A7 7 0 0 1 668.5777777777778 254V270A7 7 0 0 1 661.5777777777778 277H630.0Z" fill="#111111"/>
    <text x="680.5777777777778" y="269.92" font-size="22" font-weight="700" fill="#111111">8초 안</text>
    <text x="630.0" y="315" font-size="18" fill="#444444">나노 바나나 프로</text>
    <path d="M630.0 325H782.1333333333333A7 7 0 0 1 789.1333333333333 332V348A7 7 0 0 1 782.1333333333333 355H630.0Z" fill="#111111"/>
    <text x="801.1333333333333" y="347.92" font-size="22" font-weight="700" fill="#111111">33초</text>
    <text x="630.0" y="393" font-size="18" fill="#444444">GPT Image 2</text>
    <path d="M630.0 403H1057.0A7 7 0 0 1 1064.0 410V426A7 7 0 0 1 1057.0 433H630.0Z" fill="#111111"/>
    <text x="1076.0" y="425.92" font-size="22" font-weight="700" fill="#111111">90초</text>
    <line x1="630.0" y1="219" x2="630.0" y2="453" stroke="#D9D9D9" stroke-width="1.6"/>
    <line x1="40" y1="475" x2="1160" y2="475" stroke="#D9D9D9" stroke-width="1"/>
    <text x="40" y="501" font-size="16" fill="#6B6B6B">출처: Krea 블로그 &#x27;Introducing Krea 3&#x27; (2026-10-15). 시간은 Krea가 2026-09-24~10-01 측정한 중간값(대기 시간 포함). Krea 3은 &#x27;대부분 8초 안&#x27;이라는 상한 표기. 제작사 자체 비교.</text>
