<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 537" role="img" aria-labelledby="t d">
  <title id="t">Krea 3 편집 비용과 속도 (Krea 발표 기준)</title>
  <desc id="d">편집 10만 번 정가 기준 비용은 Krea 3 6,000달러, 나노 바나나 프로 13,500달러, GPT Image 2 22,000달러다. 편집 한 건 시간은 Krea 3이 대부분 8초 안, 나노 바나나 프로 33초, GPT Image 2 90초다.</desc>
  <rect width="1200" height="537" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="40" y="70" font-size="30" font-weight="800" fill="#111111" letter-spacing="-0.5">Krea 3 편집 비용과 속도 (Krea 발표 기준)</text>
    <text x="40" y="101" font-size="19" fill="#6B6B6B">편집 10만 번 정가 · 편집 한 건 중간 시간</text>
    <text x="40.0" y="165" font-size="24" font-weight="700" fill="#111111">편집 10만 번 비용 (달러)</text>
    <text x="40.0" y="193" font-size="18" fill="#6B6B6B">낮을수록 좋음</text>
    <text x="40.0" y="237" font-size="18" fill="#444444">Krea 3</text>
    <path d="M40.0 247H151.36363636363637A7 7 0 0 1 158.36363636363637 254V270A7 7 0 0 1 151.36363636363637 277H40.0Z" fill="#111111"/>
    <text x="170.36363636363637" y="269.92" font-size="22" font-weight="700" fill="#111111">6,000달러</text>
    <text x="40.0" y="315" font-size="18" fill="#444444">나노 바나나 프로</text>
    <path d="M40.0 325H299.3181818181818A7 7 0 0 1 306.3181818181818 332V348A7 7 0 0 1 299.3181818181818 355H40.0Z" fill="#111111"/>
    <text x="318.3181818181818" y="347.92" font-size="22" font-weight="700" fill="#111111">13,500달러</text>
    <text x="40.0" y="393" font-size="18" fill="#444444">GPT Image 2</text>
