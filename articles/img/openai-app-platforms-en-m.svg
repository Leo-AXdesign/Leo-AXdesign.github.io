<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 754" role="img" aria-labelledby="t d">
  <title id="t">ChatGPT&#x27;s app platforms: four tries in three years</title>
  <desc id="d">Plugins launched in March 2023 and shut down in April 2024. GPTs and the GPT Store launched in November 2023 and close on December 11, 2026. The Apps SDK arrived in October 2025, and plugin extensions in September 2026.</desc>
  <rect width="600" height="754" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="32" y="66" font-size="34" font-weight="800" fill="#111111" text-anchor="start">ChatGPT&#x27;s app platforms: four tries in three years</text>
    <text x="32" y="99" font-size="21" font-weight="400" fill="#6B6B6B" text-anchor="start">From launch to shutdown (or planned shutdown)</text>
    <line x1="32.0" y1="155" x2="32.0" y2="607" stroke="#D9D9D9" stroke-width="1"/>
    <text x="32.0" y="145" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="start">2023</text>
    <line x1="166.0" y1="155" x2="166.0" y2="607" stroke="#D9D9D9" stroke-width="1"/>
    <text x="166.0" y="145" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="middle">2024</text>
    <line x1="300.0" y1="155" x2="300.0" y2="607" stroke="#D9D9D9" stroke-width="1"/>
    <text x="300.0" y="145" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="middle">2025</text>
    <line x1="434.0" y1="155" x2="434.0" y2="607" stroke="#D9D9D9" stroke-width="1"/>
    <text x="434.0" y="145" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="middle">2026</text>
    <line x1="568.0" y1="155" x2="568.0" y2="607" stroke="#D9D9D9" stroke-width="1"/>
    <text x="568.0" y="145" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="end">2027</text>
    <text x="32" y="193" font-size="24" font-weight="700" fill="#111111" text-anchor="start">Plugins</text>
    <text x="32" y="222" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="start">Mar 2023 → shut down Apr 2024</text>
    <rect x="54.33333333334349" y="238" width="145.1666666666565" height="22" rx="11.0" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="32" y="305" font-size="24" font-weight="700" fill="#111111" text-anchor="start">GPTs &amp; GPT Store</text>
    <text x="32" y="334" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="start">Nov 2023 → closing Dec 11, 2026</text>
    <rect x="143.6666666666565" y="350" width="390.4983333333362" height="22" rx="11.0" fill="#111111"/>
    <rect x="523.1649999999927" y="350" width="37.5766666666882" height="22" rx="11.0" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="143.6666666666565" y="350" width="390.4983333333362" height="22" rx="11.0" fill="#111111"/>
    <text x="32" y="417" font-size="24" font-weight="700" fill="#111111" text-anchor="start">Apps SDK</text>
    <text x="32" y="446" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="start">Oct 2025 →</text>
    <rect x="400.5" y="462" width="133.6649999999927" height="22" rx="11.0" fill="#111111"/>
    <text x="32" y="529" font-size="24" font-weight="700" fill="#111111" text-anchor="start">Plugin extensions</text>
    <text x="32" y="558" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="start">Sep 2026, new</text>
    <rect x="533.9416666666748" y="574" width="22.0" height="22" rx="11.0" fill="#111111"/>
    <line x1="534.1649999999927" y1="155" x2="534.1649999999927" y2="621" stroke="#111111" stroke-width="1.5" stroke-dasharray="3 4"/>
    <text x="534.1649999999927" y="646" font-size="19" font-weight="700" fill="#111111" text-anchor="middle">Now</text>
    <rect x="32" y="663" width="34" height="16" rx="8" fill="#111111"/>
    <text x="76" y="676" font-size="19" font-weight="400" fill="#444444" text-anchor="start">Active</text>
    <rect x="181.68" y="664" width="32" height="14" rx="7" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="224.68" y="676" font-size="19" font-weight="400" fill="#444444" text-anchor="start">Shut down</text>
    <rect x="365.7" y="664" width="32" height="14" rx="7" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="408.7" y="676" font-size="19" font-weight="400" fill="#444444" text-anchor="start">Closing</text>
    <line x1="32" y1="698" x2="568" y2="698" stroke="#D9D9D9" stroke-width="1"/>
    <text x="32" y="722" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start">Sources: OpenAI announcements, antihype.com.br (as of Sep 30, 2026)</text>
  </g>
</svg>
