<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 937" role="img" aria-labelledby="t d">
  <title id="t">Four steps when an AI draft arrives</title>
  <desc id="d">When a client sends an AI draft: check which AI made it and whether commercial use is allowed, split what to keep from what to redo, quote by the list of remaining work, then record it all in writing.</desc>
  <rect width="600" height="937" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="32" y="66" font-size="30" font-weight="800" fill="#111111" text-anchor="start">Four steps when an AI draft arrives</text>
    <text x="32" y="99" font-size="21" font-weight="400" fill="#6B6B6B" text-anchor="start">A useful order before you quote</text>
    <rect x="32" y="139" width="536" height="150" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <circle cx="60" cy="169" r="15" fill="#111111"/><text x="60" y="175.12" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="86" y="177" font-size="24" font-weight="800" fill="#111111" text-anchor="start">Check</text>
    <text x="58" y="213" font-size="19" font-weight="400" fill="#444444" text-anchor="start">Which AI made it</text>
    <text x="58" y="240" font-size="19" font-weight="400" fill="#444444" text-anchor="start">Commercial use allowed?</text>
    <text x="58" y="267" font-size="19" font-weight="400" fill="#444444" text-anchor="start">Any lookalikes?</text>
    <path d="M300.0 295v22m-7 -8l7 8l7 -8" fill="none" stroke="#111111" stroke-width="2"/>
    <rect x="32" y="323" width="536" height="150" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <circle cx="60" cy="353" r="15" fill="#111111"/><text x="60" y="359.12" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="86" y="361" font-size="24" font-weight="800" fill="#111111" text-anchor="start">Split</text>
    <text x="58" y="397" font-size="19" font-weight="400" fill="#444444" text-anchor="start">Keep: direction, mood</text>
    <text x="58" y="424" font-size="19" font-weight="400" fill="#444444" text-anchor="start">Redo: type, logo</text>
    <text x="58" y="451" font-size="19" font-weight="400" fill="#444444" text-anchor="start">New: files, formats</text>
    <path d="M300.0 479v22m-7 -8l7 8l7 -8" fill="none" stroke="#111111" stroke-width="2"/>
    <rect x="32" y="507" width="536" height="150" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <circle cx="60" cy="537" r="15" fill="#111111"/><text x="60" y="543.12" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="86" y="545" font-size="24" font-weight="800" fill="#111111" text-anchor="start">Quote</text>
    <text x="58" y="581" font-size="19" font-weight="400" fill="#444444" text-anchor="start">Not by hours</text>
    <text x="58" y="608" font-size="19" font-weight="400" fill="#444444" text-anchor="start">but by the list of work</text>
    <text x="58" y="635" font-size="19" font-weight="400" fill="#444444" text-anchor="start">Include revision rounds</text>
    <path d="M300.0 663v22m-7 -8l7 8l7 -8" fill="none" stroke="#111111" stroke-width="2"/>
    <rect x="32" y="691" width="536" height="150" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <circle cx="60" cy="721" r="15" fill="#111111"/><text x="60" y="727.12" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="86" y="729" font-size="24" font-weight="800" fill="#111111" text-anchor="start">Record</text>
    <text x="58" y="765" font-size="19" font-weight="400" fill="#444444" text-anchor="start">What you received</text>
    <text x="58" y="792" font-size="19" font-weight="400" fill="#444444" text-anchor="start">and what you made,</text>
    <text x="58" y="819" font-size="19" font-weight="400" fill="#444444" text-anchor="start">in one email</text>
    <line x1="32" y1="877" x2="568" y2="877" stroke="#D9D9D9" stroke-width="1"/>
    <text x="32" y="905" font-size="17" font-weight="400" fill="#6B6B6B" text-anchor="start">The order laid out in this article</text>
  </g>
</svg>
