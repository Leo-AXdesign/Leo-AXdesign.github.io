    <line x1="32" y1="268" x2="32" y2="644" stroke="#D9D9D9" stroke-width="1.8"/>
    <line x1="32" y1="662" x2="568" y2="662" stroke="#D9D9D9" stroke-width="1"/>
    <text x="32" y="688" font-size="19" fill="#6B6B6B">출처: Figma 요금 페이지 (2026-10-18 확인).</text>
    <text x="32" y="717" font-size="19" fill="#6B6B6B">Dev·Collab 좌석은 모든 요금제에서 월 500.</text>
