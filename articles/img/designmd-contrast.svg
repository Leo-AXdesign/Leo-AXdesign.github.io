<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 693" role="img" aria-labelledby="t d">
  <title id="t">흰 바탕 위 글자색 대비</title>
  <desc id="d">흰 바탕 위 대비율. #111111 18.9, #2C2C2C 14.0, #6B6B6B 5.3, #767676 4.5, #A3A3A3 2.5. 4.5보다 낮은 #A3A3A3만 본문 글자 기준을 넘지 못한다.</desc>
