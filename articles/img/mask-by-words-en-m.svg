<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 863" role="img" aria-labelledby="t d">
  <title id="t">Asking for a partial edit in words</title>
  <desc id="d">Nano Banana 2.1 is better at editing a region you describe in words, but its model card says it sometimes confuses positions like left and right. So instead of &#x27;the text at top left&#x27; or &#x27;the person on the right&#x27;, name the object: the word SALE, the person in the hat.</desc>
  <rect width="600" height="863" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="32" y="66" font-size="34" font-weight="800" fill="#111111" text-anchor="start">Asking for a partial edit in words</text>
    <text x="32" y="99" font-size="21" font-weight="400" fill="#6B6B6B" text-anchor="start">A weakness the model card admits: mixing up left and right</text>
    <rect x="32" y="139" width="536" height="230" rx="10" fill="#F2F2F2" stroke="#111111" stroke-width="1.5"/>
    <text x="50" y="183" font-size="32" font-weight="900" fill="#111111" text-anchor="start">SALE</text>
    <text x="50" y="211" font-size="15" font-weight="600" fill="#444444" text-anchor="start">Fall arrivals</text>
    <circle cx="235.68" cy="277" r="17" fill="#D9D9D9"/>
    <path d="M205.68 355q0 -48 30 -48q30 0 30 48z" fill="#D9D9D9"/>
    <circle cx="417.91999999999996" cy="277" r="17" fill="#D9D9D9"/>
    <path d="M387.91999999999996 355q0 -48 30 -48q30 0 30 48z" fill="#D9D9D9"/>
    <path d="M393.91999999999996 267h48M403.91999999999996 267v-16h28v16" fill="#111111" stroke="#111111" stroke-width="5" stroke-linejoin="round"/>
    <text x="32" y="415" font-size="24" font-weight="800" fill="#111111" text-anchor="start">By position</text>
    <rect x="32" y="437" width="536" height="46" rx="23.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <text x="52" y="467.2" font-size="20" font-weight="600" fill="#111111" text-anchor="start">Change the text at top left</text>
    <rect x="32" y="495" width="536" height="46" rx="23.0" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <text x="52" y="525.2" font-size="20" font-weight="600" fill="#111111" text-anchor="start">Remove the person on the right</text>
    <text x="32" y="573" font-size="19" font-weight="400" fill="#6B6B6B" text-anchor="start">✕ The wrong spot may change</text>
    <text x="32" y="613" font-size="24" font-weight="800" fill="#111111" text-anchor="start">By object</text>
    <rect x="32" y="635" width="536" height="46" rx="23.0" fill="#111111" stroke="#111111" stroke-width="1.5"/>
    <text x="52" y="665.2" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="start">Change ‘SALE’ to ‘50% OFF’</text>
    <rect x="32" y="693" width="536" height="46" rx="23.0" fill="#111111" stroke="#111111" stroke-width="1.5"/>
    <text x="52" y="723.2" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="start">Remove the person in the hat</text>
    <text x="32" y="771" font-size="19" font-weight="700" fill="#111111" text-anchor="start">✓ Only one thing fits the description</text>
    <line x1="32" y1="803" x2="568" y2="803" stroke="#D9D9D9" stroke-width="1"/>
    <text x="32" y="831" font-size="17" font-weight="400" fill="#6B6B6B" text-anchor="start">Source: limitations in the Nano Banana 2.1 model card. Prompts are examples.</text>
  </g>
</svg>
