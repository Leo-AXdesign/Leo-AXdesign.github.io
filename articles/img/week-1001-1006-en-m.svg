<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1394" role="img" aria-labelledby="t d">
  <title id="t">Last week: what you now decide</title>
  <desc id="d">Six stories from last week. Shopify Canvas covers the whole store, DESIGN.md the rules, Ideogram 4.5 and FLUX 3 what to edit, InstructMesh which 3D part to fix, ChatGPT image ads a new ad slot, and Kling 4.0 the order of shots.</desc>
