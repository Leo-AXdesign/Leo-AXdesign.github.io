    <text x="32" y="99" font-size="21" font-weight="400" fill="#6B6B6B" text-anchor="start">Sep 30 – Oct 6.</text>
    <text x="32" y="130" font-size="21" font-weight="400" fill="#6B6B6B" text-anchor="start">From leaving it to luck to deciding it yourself</text>
