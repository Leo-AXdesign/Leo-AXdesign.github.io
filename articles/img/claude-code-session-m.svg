<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-labelledby="t d">
  <title id="t">클로드 코드에 말로 수정을 요청하는 장면</title>
  <desc id="d">검은 터미널 창에 "카드형 레이아웃이 많아서 복잡해 보여. 색은 빼고 흑백 위주로, 최대한 간결하게."라는 요청이 있고, 그 아래에 파일을 읽고 색상과 레이아웃을 바꾸는 단계가 차례로 적혀 있다.</desc>
  <rect width="600" height="700" rx="20" fill="#F3F3F4"/>

  <g transform="translate(24 24)">
    <rect width="552" height="652" rx="14" fill="#111111"/>
    <path d="M14 0H538A14 14 0 0 1 552 14V46H0V14A14 14 0 0 1 14 0Z" fill="#1D1D1D"/>
    <circle cx="26" cy="23" r="6" fill="#3A3A3A"/>
    <circle cx="46" cy="23" r="6" fill="#3A3A3A"/>
    <circle cx="66" cy="23" r="6" fill="#3A3A3A"/>
    <text x="300" y="29" text-anchor="middle" fill="#7C7C7C" font-size="15"
          font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">~/디자인허브 — claude</text>

    <g font-family="'SF Mono', Menlo, Consolas, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', monospace" font-size="25">
      <text x="30" y="106" fill="#F5F5F5"><tspan fill="#7C7C7C">&gt; </tspan>카드형 레이아웃이</text>
      <text x="64" y="144" fill="#F5F5F5">많아서 복잡해 보여.</text>
      <text x="64" y="182" fill="#F5F5F5">색은 빼고 흑백 위주로,</text>
      <text x="64" y="220" fill="#F5F5F5">최대한 간결하게.</text>

      <text x="30" y="292" fill="#8E8E8E">● style.css 읽는 중</text>
      <text x="30" y="334" fill="#8E8E8E">● 색상 12개 → 흑백 4개</text>
      <text x="30" y="376" fill="#8E8E8E">● 카드 → 한 줄 목록</text>
      <text x="30" y="418" fill="#8E8E8E">● 미리보기로 확인</text>

      <text x="30" y="492" fill="#F5F5F5">✓ 반영했습니다.</text>
      <text x="64" y="530" fill="#F5F5F5">미리보기에서 확인해 보세요.</text>

      <line x1="30" y1="572" x2="522" y2="572" stroke="#2A2A2A" stroke-width="1.5"/>
      <text x="30" y="618" fill="#7C7C7C">&gt;</text>
      <rect x="58" y="598" width="13" height="26" fill="#F5F5F5"/>
    </g>
  </g>
</svg>
