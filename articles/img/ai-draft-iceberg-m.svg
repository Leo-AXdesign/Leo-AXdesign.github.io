<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1115" role="img" aria-labelledby="t d">
  <title id="t">&quot;이것만 다듬어 주세요&quot; 아래에 남은 일</title>
  <desc id="d">클라이언트가 보낸 AI 시안은 결과물의 일부만 보여 준다. 그 아래에는 권리 확인, 고칠 수 있는 파일로 다시 만들기, 글자 다시 짜기, 브랜드 맞추기, 매체별 파일, 수정 대응이 남아 있다.</desc>
  <rect width="600" height="1115" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="32" y="66" font-size="34" font-weight="800" fill="#111111" text-anchor="start">&quot;이것만 다듬어 주세요&quot; 아래에 남은 일</text>
    <text x="32" y="99" font-size="21" font-weight="400" fill="#6B6B6B" text-anchor="start">클라이언트가 AI로 만든 시안을 보낼 때. 개념도</text>
    <text x="32" y="159" font-size="23" font-weight="800" fill="#111111" text-anchor="start">보이는 부분</text>
    <rect x="150.0" y="175" width="300" height="110" rx="10" fill="#F2F2F2" stroke="#111111" stroke-width="2"/>
    <circle cx="384.0" cy="210.2" r="14.3" fill="#D9D9D9"/>
    <path d="M152.0 283L255.0 224.5L315.0 252.0L366.0 235.5L448.0 283Z" fill="#D9D9D9"/>
    <text x="300.0" y="317" font-size="20" font-weight="700" fill="#444444" text-anchor="middle">AI가 만든 그림 한 장</text>
    <path d="M32 345q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0q15 -8 30 0" fill="none" stroke="#111111" stroke-width="2"/>
    <text x="568" y="335" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="end">수면</text>
    <text x="32" y="395" font-size="23" font-weight="800" fill="#111111" text-anchor="start">실제로 남은 일</text>
    <rect x="32.0" y="415" width="536.0" height="92" rx="12" fill="#111111"/>
    <text x="52.0" y="451" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="start">권리 확인</text>
    <text x="52.0" y="479" font-size="16" font-weight="400" fill="#D9D9D9" text-anchor="start">상업적으로 써도 되나, 닮은 로고·인물은 없나</text>
    <rect x="32.0" y="519" width="536.0" height="92" rx="12" fill="#111111"/>
    <text x="52.0" y="555" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="start">다시 만들기</text>
    <text x="52.0" y="583" font-size="16" font-weight="400" fill="#D9D9D9" text-anchor="start">해상도, 벡터, 레이어. 고칠 수 있는 파일로</text>
    <rect x="32.0" y="623" width="536.0" height="92" rx="12" fill="#111111"/>
    <text x="52.0" y="659" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="start">글자 다시 짜기</text>
    <text x="52.0" y="687" font-size="16" font-weight="400" fill="#D9D9D9" text-anchor="start">AI가 그린 글자는 대개 쓸 수 없다</text>
    <rect x="32.0" y="727" width="536.0" height="92" rx="12" fill="#111111"/>
    <text x="52.0" y="763" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="start">브랜드 맞추기</text>
    <text x="52.0" y="791" font-size="16" font-weight="400" fill="#D9D9D9" text-anchor="start">색·서체·간격을 가이드에 맞게</text>
    <rect x="32.0" y="831" width="536.0" height="92" rx="12" fill="#111111"/>
    <text x="52.0" y="867" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="start">매체별 파일</text>
    <text x="52.0" y="895" font-size="16" font-weight="400" fill="#D9D9D9" text-anchor="start">인쇄·웹·SNS 크기와 형식</text>
    <rect x="32.0" y="935" width="536.0" height="92" rx="12" fill="#111111"/>
    <text x="52.0" y="971" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="start">수정 대응</text>
    <text x="52.0" y="999" font-size="16" font-weight="400" fill="#D9D9D9" text-anchor="start">&quot;조금만 더&quot;가 몇 번 오갈지</text>
    <line x1="32" y1="1055" x2="568" y2="1055" stroke="#D9D9D9" stroke-width="1"/>
    <text x="32" y="1083" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="start">출처: Fast Company(2026. 10. 12) 디자이너 인터뷰를 바탕으로 정리</text>
  </g>
</svg>
