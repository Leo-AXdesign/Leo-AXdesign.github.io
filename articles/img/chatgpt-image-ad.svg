    <text x="698.0" y="467.44" font-size="15" font-weight="400" fill="#444444" text-anchor="start">제품을 쓰는 장면,</text>
    <text x="698.0" y="492.44" font-size="15" font-weight="400" fill="#444444" text-anchor="start">&#x27;영감&#x27;으로 제시</text>
