    <text x="80" y="283" font-size="17" font-weight="700" fill="#111111" text-anchor="start">내가 요청한 그림</text>
    <rect x="684.0" y="254" width="452.0" height="279" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.5" stroke-dasharray="7 5"/>
