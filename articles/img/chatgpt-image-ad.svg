<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 772" role="img" aria-labelledby="t d">
  <title id="t">그림이 그려지는 동안, 옆에 붙는 광고</title>
  <desc id="d">챗GPT가 그림을 만드는 동안, 만든 그림과 떨어진 자리에 광고라고 표시된 이미지 광고가 붙는다. 제품을 쓰는 장면이나 관련 경험을 &#x27;영감&#x27;처럼 보여 주는 형식이다.</desc>
  <rect width="1200" height="772" rx="20" fill="#FFFFFF"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
