    <text x="722.1600000000001" y="215" font-size="17" font-weight="400" fill="#FFFFFF" text-anchor="start">캠핑장 저녁 풍경, 따뜻한 조명으로 그려 줘</text>
    <rect x="64" y="254" width="560.0" height="279" rx="12" fill="#F2F2F2" stroke="#111111" stroke-width="1.5"/>
