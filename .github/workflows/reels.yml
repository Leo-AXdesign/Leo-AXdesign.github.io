# 인스타 릴스 영상을 만듭니다. 사이트 투어(tour)는 바깥 사이트 화면을 찍어야 해서 여기서 돌립니다.
# 만든 영상은 social/reels/ 에 올라가고, 끝나면 deploy.yml 이 사이트에 배포합니다.
#   → https://designrefs.com/social/reels/<이름>.mp4
# 돌리는 법: GitHub 저장소 → Actions → Build reels → Run workflow
#   targets 예: "tour:fonts-pick cards:fonts-pick"  (여러 개는 띄어쓰기로)
name: Build reels

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "만들 릴스 (예: tour:fonts-pick cards:colors-pick)"
        required: true
        default: "tour:fonts-pick"

permissions:
  contents: write

concurrency:
  group: build-reels
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      PYTHONDONTWRITEBYTECODE: "1"
      CHROME_PATH: /usr/bin/google-chrome
      CHROME_FLAGS: "--no-sandbox --lang=ko-KR"
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg, Korean fonts, Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          pip install -q pillow
      - name: Build reels
        env:
          TARGETS: ${{ inputs.targets }}
        run: python3 tools/build-reels.py $TARGETS
      - name: Commit
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          git config user.name "designrefs-bot"
          git config user.email "nisov0924@gmail.com"
          git add social/reels
          if git diff --cached --quiet; then
            echo "바뀐 것이 없습니다."
          else
            git commit -m "릴스 영상 갱신: $TARGETS"
            git pull --rebase -q origin main
            git push
          fi
